name: ci
on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install tools
        run: pip install jinja2==3.1.4 flake8==7.1.1
      - name: Macros parse, compile and follow the safety rules
        run: python tools/check_macros.py
      - name: JSON files are valid
        run: for f in mainsail-theme/*.json; do python -m json.tool "$f" >/dev/null && echo "ok $f"; done
      - name: Python errors
        run: flake8 --select=F --max-line-length=120 tools scripts
      - name: Shell scripts (errors only)
        run: shellcheck --severity=error install.sh scripts/*.sh
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Secret scan (verified + unknown findings fail the build)
        uses: trufflesecurity/trufflehog@v3.82.13
        with:
          extra_args: --results=verified,unknown
