# STARSTACK (D-076): installed to /etc/X11/xorg.conf.d/ by install.sh (step 8, faster boot).
# The X server loaded its software OpenGL renderer (Mesa swrast + LLVM, ~160 MB) at every start:
# 5.3 s of the boot on the TFT35. The touchscreen app doesn't use OpenGL (the fork sets
# GDK_GL=disable), so the GLX module is not loaded. Remove this file to get it back.
Section "Module"
    Disable "glx"
EndSection
