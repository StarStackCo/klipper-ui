# =====================================================================
#  ██ BENCH CONFIG v2.2: NOT FOR THE REAL PRINTER ██
# FLY Micro4 with NOTHING wired to it. Purpose: make every UI button
# appear (cartesian printer, extruder, bed, fans, runout sensor) so the
# Mainsail + KlipperScreen UI can be built and tested on the bench.
#
# SAFETY DESIGN (see docs/DECISIONS.md D-027):
# - The real heater outputs gpio20 (hotend) and gpio21 (bed) are NOT
#   referenced anywhere in this file. They stay off.
# - Fake heaters drive logic-only signal pins (gpio19 servo, gpio11 RGB),
#   so even if this file were loaded on the real printer, nothing heats.
# - Fake temperatures come from the Pi CPU sensor (~40 °C), so targets
#   never get reached. verify_heater is relaxed ONLY because the fake
#   heaters cannot heat anything.
# - Homing is faked (endstops read "triggered" instantly), so nothing moves far.
# Pin source: Mellow FLY-Micro4 docs (mellow.klipper.cn), checked 2026-10-04.
# =====================================================================

[include mainsail.cfg]          # pause/resume/cancel, virtual SD, display_status
[include starstack_macros.cfg]   # StarStack UI macros (macros/starstack_macros.cfg)

[save_variables]                 # remembers the loaded filament
filename: ~/printer_data/config/variables.cfg

[mcu]
# FLY Micro4 (RP2040), confirmed by user 2026-10-04 (Q-016)
serial: /dev/serial/by-id/usb-Klipper_rp2040_E6647C7403679636-if00

[printer]
kinematics: cartesian
max_velocity: 300
max_accel: 3000
max_z_velocity: 15
max_z_accel: 100

# --- Steppers: real Micro4 driver pins, no motors attached -----------
# Endstops: open input with pull-up reads "triggered" → homing completes
# instantly. homing_retract_dist 0 skips the release check.
# Bed: 180 x 180 x 180 mm (real printer size, user 2026-10-04)
[stepper_x]
step_pin: gpio6
dir_pin: gpio3
enable_pin: !gpio7
microsteps: 16
rotation_distance: 40
endstop_pin: ^!gpio12             # inverted: this pin reads low on the bench (shared with driver DIAG)
position_endstop: 0
position_max: 180
homing_speed: 50
homing_retract_dist: 0

[stepper_y]
step_pin: gpio1
dir_pin: gpio0
enable_pin: !gpio2
microsteps: 16
rotation_distance: 40
endstop_pin: ^gpio13
position_endstop: 0
position_max: 180
homing_speed: 50
homing_retract_dist: 0

[stepper_z]
step_pin: gpio23
dir_pin: gpio22
enable_pin: !gpio24
microsteps: 16
rotation_distance: 8
endstop_pin: ^gpio14
position_endstop: 0
position_max: 180
homing_speed: 10
homing_retract_dist: 0

# --- FAKE heaters: logic pins only, Pi CPU as the sensor -------------
[temperature_sensor BTT_Pi]
sensor_type: temperature_host

[extruder]
step_pin: gpio26
dir_pin: gpio25
enable_pin: !gpio27
microsteps: 16
rotation_distance: 7.7
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: gpio19              # FAKE: servo signal pin, NOT the hotend MOSFET (gpio20)
sensor_type: temperature_host   # FAKE: Pi CPU temp
min_temp: 0
max_temp: 300                   # same limit the real printer will use (to confirm in Phase 3.5)
min_extrude_temp: 170           # real value kept, so "too cold to extrude" UI can be tested
control: watermark
max_extrude_only_distance: 150

[verify_heater extruder]        # relaxed ONLY because this heater is fake
max_error: 100000
check_gain_time: 3600

[heater_bed]
heater_pin: gpio11              # FAKE: RGB data pin, NOT the bed MOSFET (gpio21)
sensor_type: temperature_host   # FAKE: Pi CPU temp
min_temp: 0
max_temp: 110
control: watermark

[verify_heater heater_bed]      # relaxed ONLY because this heater is fake
max_error: 100000
check_gain_time: 3600

# --- Fans: real fan outputs, nothing connected (harmless) ------------
[fan]
pin: gpio16

[heater_fan hotend_fan]
pin: gpio17
heater: extruder
heater_temp: 50.0

# --- Features the UI needs -------------------------------------------
[exclude_object]                # cancel-object map + list

[filament_switch_sensor runout]
switch_pin: ^!gpio15            # inverted: pin reads low on the bench → shows "filament present"
pause_on_runout: True
runout_gcode: _SS_RUNOUT

[idle_timeout]
timeout: 600

# Bench warning shown in both UIs at every start
[delayed_gcode bench_warning]
initial_duration: 2
gcode:
  RESPOND TYPE=error MSG="BENCH CONFIG v2.2 LOADED: fake heaters, not for the real printer"
  # Bench only: the runout pin is shared with a driver DIAG line and floats with
  # nothing wired, so it triggers falsely. Keep the sensor object (UI shows it)
  # but disabled. The real printer uses a real sensor (Phase 3.5 check).
  SET_FILAMENT_SENSOR SENSOR=runout ENABLE=0
  RESPOND MSG="Bench: runout sensor disabled (floating pin)"
