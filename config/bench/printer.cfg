# =====================================================================
# BENCH CONFIG: FLY Micro4 with NOTHING wired to it
# Purpose: let Klipper reach "Ready" so Mainsail + KlipperScreen can be
# developed and tested on the bench (BTT Pi + TFT35 SPI on USB power).
#
# SAFETY: no heaters, no steppers, no fans, no endstops are defined.
# No output pin on the board is driven. Only read-only temperature
# sensors (MCU chip + Pi CPU) are used.
#
# NOT FOR USE ON THE REAL PRINTER. The real printer.cfg is written
# separately and safety-reviewed before Phase 3.5 (see docs/DECISIONS.md).
# =====================================================================

[include mainsail.cfg]          # Mainsail's standard pause/resume/cancel + virtual SD

[mcu]
# FLY Micro4 (RP2040), confirmed by user 2026-10-04 (Q-016)
serial: /dev/serial/by-id/usb-Klipper_rp2040_E6647C7403679636-if00

[printer]
kinematics: none                # no motion system: nothing can move
max_velocity: 1
max_accel: 1

# Read-only sensors so the UIs have live data to display
[temperature_sensor Micro4_MCU]
sensor_type: temperature_mcu
sensor_mcu: mcu

[temperature_sensor BTT_Pi]
sensor_type: temperature_host
