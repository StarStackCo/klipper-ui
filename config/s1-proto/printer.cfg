# =====================================================================
#  StarStack S1 PROTOTYPE: printer.cfg v1.7 (v1.6 split by D-NEW shared config)
#  Repo: StarStackCo/klipper-ui  ·  config/s1-proto/printer.cfg
#
#  Only this printer's own values. Everything shared by every S1 is in
#  config/s1_common.cfg (on the Pi: starstack_s1_common.cfg), included first;
#  a value here wins over the same one there (D-NEW shared config).
#
#  The old prototype S1 (hundreds of hours, kept for wear and stress
#  testing). Same hardware as the standard; its travel, brush and motor
#  ports are its own. Printer type on the Pi: s1-proto.
# =====================================================================

[include mainsail.cfg]              # Pause / Resume / Cancel (set up in _CLIENT_VARIABLE)
[include starstack_macros.cfg]      # StarStack UI macros (macros/starstack_macros.cfg)
[include starstack_s1_common.cfg]   # shared S1 settings (config/s1_common.cfg)

[save_variables]                    # remembers the loaded filament
filename: ~/printer_data/config/variables.cfg

[mcu]
serial: /dev/serial/by-id/usb-Klipper_rp2040_E6647C7403679636-if00

#####################################################################
#   Motor ports (driver slot: step/dir/enable + uart_address/diag_pin
#   move together) and travel
#####################################################################
[stepper_x]
step_pin: gpio26
dir_pin: !gpio25
enable_pin: !gpio27
position_min: -2
position_max: 195
position_endstop: 195

[tmc2209 stepper_x]
uart_address: 2
diag_pin: ^gpio15
driver_SGTHRS: 80                   # sensorless homing threshold, tuned per printer

[stepper_y]
step_pin: gpio23
dir_pin: gpio22
enable_pin: !gpio24
position_min: 0
position_max: 206
position_endstop: 206

[tmc2209 stepper_y]
uart_address: 3
diag_pin: ^gpio12
driver_SGTHRS: 100                  # sensorless homing threshold, tuned per printer

[stepper_z]
step_pin: gpio1
dir_pin: gpio0
enable_pin: !gpio2
position_max: 165
position_min: -5

[tmc2209 stepper_z]
uart_address: 1

[extruder]
step_pin: gpio6
dir_pin: !gpio3
enable_pin: !gpio7

[tmc2209 extruder]
uart_address: 0

#####################################################################
#   Probe offset, bed mesh area, park, brush and homing spot
#####################################################################
[probe]
z_offset: 0.0                       # PZ: the nozzle is the probe (SAVE_CONFIG may write it)

[bed_mesh]
mesh_min: 10, 10
mesh_max: 170, 170

[gcode_macro _CLIENT_VARIABLE]
variable_custom_park_x    : 0.0
variable_custom_park_y    : 180.0
variable_park_at_cancel_x : 0.0
variable_park_at_cancel_y : 180.0

[gcode_macro NOZZLE_CLEAN]
variable_brush_x:     90
variable_brush_y:     185
variable_brush_z:     1.2
variable_park_x:      133           # Z re-home spot after cleaning (D-143)
variable_park_y:      185

[gcode_macro _HOME_SPOT]
description: This printer's Z homing spot, read by [homing_override] (not a button)
variable_x:         45              # D-143: X45 Y185, gentler cable arc than X133
variable_y:         185
variable_bed_x_min: 0               # inside this box (over the bed) Z homes where the head is;
variable_bed_x_max: 180             # outside it, the head goes to x, y first
variable_bed_y_min: 0
variable_bed_y_max: 185
gcode:

[exclude_object]

