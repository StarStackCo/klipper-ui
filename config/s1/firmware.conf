# STARSTACK: how the update helper keeps the S1's board firmware at the host's Klipper version
# (klipper-ui D-083, D-087). Used when install.sh ran with --printer s1.
[firmware]
# FLY Micro4 (RP2040), Katapult bootloader, Klipper at 0x10004000 (16 KiB offset), USB
build_config: micro4-firmware.config
method: katapult
