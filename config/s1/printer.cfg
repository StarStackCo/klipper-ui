# =====================================================================
#  StarStack S1: printer.cfg v1 (Phase 3.5, B-3, Q-050, D-081)
#  Repo: StarStackCo/klipper-ui  ·  config/s1/printer.cfg
#
#  Built from the user's working config (config-20261007-152031.zip,
#  printer.cfg of 2026-09-15). Pins, steppers, homing, probe, extruder
#  and PID values are unchanged from it unless marked CHANGED.
#
#  Hardware (user, 2026-10-07):
#    FLY Micro4 (RP2040), the bench board, wired like the old board
#    Cartesian, 180 x 180 bed, 165 mm Z, sensorless X/Y
#    E3D PZ probe (nozzle probe, z_offset 0) on gpio19
#    E3D Revo Voron 24 V 40 W, Galileo 2 standalone extruder
#    Nozzle brush at X90 Y185. No runout sensor, no camera.
#
#  Slicer (OrcaSlicer "StarStack S1") start G-code calls: G28,
#  NOZZLE_CLEAN, BED_MESH_CALIBRATE; change filament calls CHANGE_FILAMENT;
#  pause calls PAUSE.
# =====================================================================

[include mainsail.cfg]           # Pause / Resume / Cancel (set up in _CLIENT_VARIABLE below)
[include starstack_macros.cfg]   # StarStack UI macros (macros/starstack_macros.cfg)

[save_variables]                 # remembers the loaded filament
filename: ~/printer_data/config/variables.cfg

[mcu]
# FLY Micro4, the bench board (Q-050). Checked on the Pi at power-up.
serial: /dev/serial/by-id/usb-Klipper_rp2040_E6647C7403679636-if00

[temperature_sensor BTT_Pi]
sensor_type: temperature_host

#####################################################################
#   Motion limits
#####################################################################
[printer]
kinematics: cartesian
max_velocity: 200
max_accel: 2000
max_z_velocity: 15
max_z_accel: 300
square_corner_velocity: 6.0

[stepper_x]
step_pin: gpio26
dir_pin: !gpio25
enable_pin: !gpio27
rotation_distance: 40
microsteps: 64
full_steps_per_rotation: 200
endstop_pin: tmc2209_stepper_x:virtual_endstop
position_min: -2
position_max: 195
position_endstop: 195
homing_speed: 40                 # sensorless: keep at 40 mm/s or below
homing_retract_dist: 0

[tmc2209 stepper_x]
uart_pin: gpio9
uart_address: 2
interpolate: True
run_current: 0.8
sense_resistor: 0.110
stealthchop_threshold: 999999           # always StealthChop (old value 999999999999999, same effect)
diag_pin: ^gpio15
driver_SGTHRS: 80

[stepper_y]
step_pin: gpio23
dir_pin: gpio22
enable_pin: !gpio24
rotation_distance: 40
microsteps: 64
full_steps_per_rotation: 200
endstop_pin: tmc2209_stepper_y:virtual_endstop
position_min: 0
position_max: 206
position_endstop: 206
homing_speed: 40
homing_retract_dist: 0

[tmc2209 stepper_y]
uart_pin: gpio9
uart_address: 3
interpolate: True
run_current: 0.8
sense_resistor: 0.110
stealthchop_threshold: 999999           # always StealthChop (old value 999999999999999, same effect)
diag_pin: ^gpio12
driver_SGTHRS: 100

#####################################################################
#   Probe: E3D PZ (the nozzle is the probe)
#####################################################################
[probe]
pin: !gpio19
x_offset: 0.0
y_offset: 0.0
z_offset: 0.0
speed: 20
samples: 3
samples_tolerance: 0.3
sample_retract_dist: 3.0
samples_tolerance_retries: 5
lift_speed: 10
activate_gcode:
    G4 P500
    SET_TMC_CURRENT STEPPER=stepper_z CURRENT=0.4
deactivate_gcode:
    {% set run_current = printer.configfile.config['tmc2209 stepper_z'].run_current | float %}
    SET_TMC_CURRENT STEPPER=stepper_z CURRENT={run_current}

[stepper_z]
step_pin: gpio1
dir_pin: gpio0
enable_pin: !gpio2
rotation_distance: 8
microsteps: 64
endstop_pin: probe:z_virtual_endstop
position_max: 165
position_min: -5
homing_speed: 20
second_homing_speed: 20
homing_retract_dist: 3.0

[tmc2209 stepper_z]
uart_pin: gpio9
uart_address: 1
interpolate: True
run_current: 0.6
hold_current: 0.50
sense_resistor: 0.110
stealthchop_threshold: 0

#####################################################################
#   Extruder: Galileo 2 standalone + Revo Voron 24 V 40 W
#####################################################################
[extruder]
step_pin: gpio6
dir_pin: !gpio3
enable_pin: !gpio7
microsteps: 16
rotation_distance: 47.088
gear_ratio: 9:1
step_pulse_duration: 0.000004
nozzle_diameter: 0.400
filament_diameter: 1.75
max_extrude_cross_section: 3
max_extrude_only_distance: 500
max_extrude_only_velocity: 120
pressure_advance: 0.025
pressure_advance_smooth_time: 0.03
heater_pin: gpio20
sensor_type: ATC Semitec 104NT-4-R025H42G   # Revo thermistor
sensor_pin: gpio28
max_power: 1.0
min_temp: 0                      # CHANGED from -50: a broken or unplugged sensor must stop the printer
max_temp: 300                    # Revo limit
min_extrude_temp: 150

[tmc2209 extruder]
uart_pin: gpio9
uart_address: 0
interpolate: False
run_current: 0.6
sense_resistor: 0.110
stealthchop_threshold: 0

#####################################################################
#   Bed
#####################################################################
[heater_bed]
heater_pin: gpio21
sensor_type: Generic 3950
sensor_pin: gpio29
smooth_time: 3.0
min_temp: 0                      # CHANGED from -50 (same reason as the nozzle)
max_temp: 120

#####################################################################
#   Fans
#####################################################################
[fan]
pin: gpio17
max_power: 1.0
kick_start_time: 0.5
off_below: 0.13
cycle_time: 0.010

[heater_fan hotend_fan]
pin: gpio16
tachometer_pin: ^gpio18
max_power: 1.0
kick_start_time: 0.5
heater: extruder
heater_temp: 50.0

#####################################################################
#   Homing: sensorless X/Y, Z on the PZ probe at the back
#####################################################################
[homing_override]
axes: z
set_position_z: 0
gcode:
    G90
    G0 Z3 F1200                  # small lift before moving
    {% set home_all = 'X' not in params and 'Y' not in params and 'Z' not in params %}
    {% set home_x = home_all or 'X' in params %}
    {% set home_y = home_all or 'Y' in params %}
    {% set home_z = home_all or 'Z' in params %}
    {% set x_was_unhomed = not 'x' in printer.toolhead.homed_axes %}
    {% set y_was_unhomed = not 'y' in printer.toolhead.homed_axes %}
    {% if home_x or x_was_unhomed %}
        G28 X
    {% endif %}
    {% if home_y or y_was_unhomed %}
        G28 Y
    {% endif %}
    {% if home_z %}
        {% set cur_x = printer.toolhead.position[0] | float %}
        {% set cur_y = printer.toolhead.position[1] | float %}
        {% if home_all or x_was_unhomed or y_was_unhomed or cur_x < 0 or cur_x > 180 or cur_y < 0 or cur_y > 185 %}
            G0 X133 Y185 F6000
        {% endif %}
        G28 Z
        G0 Z3 F1200
    {% endif %}

#####################################################################
#   Bed mesh (the slicer runs BED_MESH_CALIBRATE after NOZZLE_CLEAN)
#####################################################################
[bed_mesh]
speed: 120
horizontal_move_z: 3
mesh_min: 10, 10
mesh_max: 170, 170
probe_count: 3, 3
mesh_pps: 2, 2
adaptive_margin: 5               # used by BED_MESH_CALIBRATE ADAPTIVE=1

#####################################################################
#   Pause / Resume / Cancel: Mainsail's macros with this printer's
#   park spot and lift (D-081). Replaces the old custom PAUSE, RESUME
#   and CANCEL_PRINT, which did the same minus the checks.
#####################################################################
[pause_resume]
recover_velocity: 100

[gcode_macro _CLIENT_VARIABLE]
variable_use_custom_pos   : True
variable_custom_park_x    : 0.0
variable_custom_park_y    : 180.0
variable_custom_park_dz   : 10.0           # lift 10 mm when pausing
variable_retract          : 1.0
variable_cancel_retract   : 5.0
variable_speed_retract    : 35.0
variable_unretract        : 1.0
variable_speed_unretract  : 35.0
variable_speed_hop        : 15.0
variable_speed_move       : 100.0
variable_park_at_cancel   : True
variable_park_at_cancel_x : 0.0
variable_park_at_cancel_y : 180.0
variable_use_fw_retract   : False
variable_idle_timeout     : 0              # keep [idle_timeout] below while paused
variable_runout_sensor    : ""             # none fitted
variable_user_pause_macro : "_S1_PAUSE_FAN"
variable_user_resume_macro: "_S1_RESUME_FAN"
variable_user_cancel_macro: "_S1_CANCEL_LIFT"
gcode:

[gcode_macro _S1_PAUSE_FAN]
description: Pause: remember the part fan speed and turn it off (not a button)
variable_speed: 0.0
gcode:
    SET_GCODE_VARIABLE MACRO=_S1_PAUSE_FAN VARIABLE=speed VALUE={printer.fan.speed}
    M107

[gcode_macro _S1_RESUME_FAN]
description: Resume: put the part fan back to its speed before the pause (not a button)
gcode:
    {% set s = printer["gcode_macro _S1_PAUSE_FAN"].speed | float %}
    {% if s > 0.01 %}
        M106 S{(s * 255) | round | int}
    {% endif %}
    SET_GCODE_VARIABLE MACRO=_S1_PAUSE_FAN VARIABLE=speed VALUE=0.0

[gcode_macro _S1_CANCEL_LIFT]
description: Cancel: lift up to 40 mm more so the print is easy to take off (not a button)
gcode:
    {% if 'z' in printer.toolhead.homed_axes %}
        {% set z = printer.toolhead.position.z | float %}
        {% set top = printer.toolhead.axis_maximum.z | float %}
        {% set target = [z + 40, top] | min %}
        {% if target > z %}
            G90
            G1 Z{target} F720
        {% endif %}
    {% endif %}

[idle_timeout]
timeout: 900
gcode:
    {% if printer.pause_resume.is_paused %}
        # Paused and left alone: nozzle off only. The bed and motors stay on so the
        # print stays stuck down and in position; Resume reheats the nozzle.
        M104 S0
        RESPOND TYPE=error MSG="Paused for 15 minutes: nozzle heater turned off. Resume heats it again."
    {% else %}
        TURN_OFF_HEATERS
        M84
    {% endif %}

#####################################################################
#   This printer's macros (from the old macros.cfg)
#####################################################################
[gcode_macro CHANGE_FILAMENT]
description: Color change (called by the slicer): same as M600
gcode:
    M600

[gcode_macro NOZZLE_CLEAN]
description: Clean nozzle on the brush, then wait at 150°C for probing
variable_brush_x:     90
variable_brush_y:     185
variable_brush_z:     1.2
variable_wipe_count:  8
variable_wipe_dist_x: 15
variable_wipe_dist_y: 5
variable_park_x:      45
variable_park_y:      185
variable_clean_temp:  150        # E3D PZ: probe with the nozzle at about 150°C
gcode:
    {% if "xyz" not in printer.toolhead.homed_axes %}
        G28
    {% endif %}
    SAVE_GCODE_STATE NAME=STATE_NOZZLE_CLEAN
    G90
    G1 Z{brush_z + 3} F4000
    G1 X{brush_x} Y{brush_y} F10000
    G1 Z{brush_z} F2000
    {% for i in range(wipe_count) %}
        G1 X{brush_x - wipe_dist_x + i} F12000
        G1 X{brush_x + wipe_dist_x - i} F12000
    {% endfor %}
    G1 X{brush_x} F12000
    {% for i in range(wipe_count) %}
        G1 Y{brush_y - wipe_dist_y + i} F12000
        G1 Y{brush_y + wipe_dist_y - i} F12000
    {% endfor %}
    G1 Z{brush_z + 3} F2000
    M104 S{clean_temp}
    G1 X{park_x} Y{park_y} F10000
    G28 Z                        # re-home Z now that the nozzle is clean
    G4 P500
    G1 Z0 F1000
    M109 S{clean_temp}
    RESTORE_GCODE_STATE NAME=STATE_NOZZLE_CLEAN

[exclude_object]

[force_move]
enable_force_move: False

