# =====================================================================
#  StarStack S1 production standard: printer.cfg v2.0, commissioning (D-NEW new standard)
#  Repo: StarStackCo/klipper-ui  ·  config/s1/printer.cfg
#
#  Only this printer's own values. Everything shared by every S1 is in
#  config/s1_common.cfg (on the Pi: starstack_s1_common.cfg), included first;
#  a value here wins over the same one there (D-NEW shared config).
#
#  The standard the new units copy: 180 x 180 x 180 mm build volume.
#  Printer type on the Pi: s1. NEW-S1 marks values not measured yet on
#  the new printer: safe starting values. None may remain before a print.
# =====================================================================

[include mainsail.cfg]              # Pause / Resume / Cancel (set up in _CLIENT_VARIABLE)
[include starstack_macros.cfg]      # StarStack UI macros (macros/starstack_macros.cfg)
[include starstack_s1_common.cfg]   # shared S1 settings (config/s1_common.cfg)

[save_variables]                    # remembers the loaded filament
filename: ~/printer_data/config/variables.cfg

[mcu]
serial: /dev/serial/by-id/usb-Klipper_rp2040_NEW-S1-if00   # NEW-S1: this unit's board, from ls /dev/serial/by-id

#####################################################################
#   Motor ports (driver slot: step/dir/enable + uart_address/diag_pin
#   move together) and travel
#####################################################################
# NEW-S1: motors sit on different ports on this printer; every pin and uart_address below is the
# prototype's until STEPPER_BUZZ shows which motor is on which slot.
[stepper_x]
step_pin: gpio26   # NEW-S1
dir_pin: !gpio25   # NEW-S1
enable_pin: !gpio27   # NEW-S1
position_min: 18                   # NEW-S1: prototype -2; stops 20 mm short of the far end until measured
position_max: 195   # NEW-S1
position_endstop: 195   # NEW-S1: set so X0 is the bed's left edge

[tmc2209 stepper_x]
uart_address: 2   # NEW-S1
diag_pin: ^gpio15   # NEW-S1
driver_SGTHRS: 80                   # sensorless homing threshold, tuned per printer

[stepper_y]
step_pin: gpio23   # NEW-S1
dir_pin: gpio22   # NEW-S1
enable_pin: !gpio24   # NEW-S1
position_min: 20                   # NEW-S1: prototype 0; stops 20 mm short of the far end until measured
position_max: 206   # NEW-S1
position_endstop: 206   # NEW-S1: set so Y0 is the bed's front edge

[tmc2209 stepper_y]
uart_address: 3   # NEW-S1
diag_pin: ^gpio12   # NEW-S1
driver_SGTHRS: 100                  # sensorless homing threshold, tuned per printer

[stepper_z]
step_pin: gpio1   # NEW-S1
dir_pin: gpio0   # NEW-S1
enable_pin: !gpio2   # NEW-S1
position_max: 165   # NEW-S1: build height 180; raised once the real top is found by jogging up
position_min: -5

[tmc2209 stepper_z]
uart_address: 1   # NEW-S1

[extruder]
step_pin: gpio6   # NEW-S1
dir_pin: !gpio3   # NEW-S1
enable_pin: !gpio7   # NEW-S1

[tmc2209 extruder]
uart_address: 0   # NEW-S1

#####################################################################
#   Probe offset, bed mesh area, park, brush and homing spot
#####################################################################
[probe]
z_offset: 0.0                       # PZ: the nozzle is the probe (SAVE_CONFIG may write it)

[bed_mesh]
mesh_min: 20, 20                    # NEW-S1: prototype 10, 10 (inside the starting travel limits)
mesh_max: 170, 170   # NEW-S1

[gcode_macro _CLIENT_VARIABLE]
variable_custom_park_x    : 20.0   # NEW-S1: prototype 0.0 (inside the starting travel limits)
variable_custom_park_y    : 180.0   # NEW-S1
variable_park_at_cancel_x : 20.0   # NEW-S1: prototype 0.0 (inside the starting travel limits)
variable_park_at_cancel_y : 180.0   # NEW-S1

[gcode_macro NOZZLE_CLEAN]
variable_brush_x:     90   # NEW-S1: brush not measured; no NOZZLE_CLEAN or print yet
variable_brush_y:     185   # NEW-S1
variable_brush_z:     1.2   # NEW-S1
variable_park_x:      133           # Z re-home spot after cleaning (D-143)   # NEW-S1
variable_park_y:      185   # NEW-S1

[gcode_macro _HOME_SPOT]
description: This printer's Z homing spot, read by [homing_override] (not a button)
variable_x:         45              # D-143: X45 Y185, gentler cable arc than X133   # NEW-S1: check it is over the bed before the first G28 Z
variable_y:         185   # NEW-S1
variable_bed_x_max: 180             # inside 0..bed_x_max, 0..bed_y_max Z homes where the head is
variable_bed_y_max: 185   # NEW-S1
gcode:

[exclude_object]

