# =====================================================================
#  StarStack S1: shared settings, v1.0 (D-NEW shared config)
#  Repo: StarStackCo/klipper-ui  ·  config/s1_common.cfg
#  On the Pi: ~/printer_data/config/starstack_s1_common.cfg, a link to
#  this file made by install.sh, so it changes with every klipper-ui update.
#
#  Everything every S1 has in common: the prototype and the production units
#  are the same hardware (FLY Micro4, cartesian, sensorless X/Y, E3D PZ probe
#  on gpio19, Revo Voron 24 V 40 W, Galileo 2, no runout sensor, no camera).
#  Each printer's own printer.cfg includes this file first, then sets what is
#  only its own: board serial, motor ports and directions, travel, Z offset,
#  sensorless thresholds, mesh area, park, brush and homing spot. Klipper
#  merges a section given twice; the printer.cfg value wins.
#  Never put a value here that SAVE_CONFIG writes (PID, probe z_offset):
#  Klipper refuses SAVE_CONFIG when an included file sets it.
#  Values come from the prototype's v1.6 (D-081 to D-143).
# =====================================================================

[temperature_sensor BTT_Pi]
sensor_type: temperature_host

#####################################################################
#   Motion limits
#####################################################################
[printer]
kinematics: cartesian
max_velocity: 200                # back from 400: two real layer shifts in the first long print at 400 (D-110)
max_accel: 2000
max_z_velocity: 15
max_z_accel: 300
square_corner_velocity: 6.0

[stepper_x]
rotation_distance: 40
microsteps: 64
full_steps_per_rotation: 200
endstop_pin: tmc2209_stepper_x:virtual_endstop
homing_speed: 40                 # sensorless: keep at 40 mm/s or below
homing_retract_dist: 0

[tmc2209 stepper_x]
uart_pin: gpio9
interpolate: True
run_current: 0.8
sense_resistor: 0.110
stealthchop_threshold: 999999           # always StealthChop (old value 999999999999999, same effect)

[stepper_y]
rotation_distance: 40
microsteps: 64
full_steps_per_rotation: 200
endstop_pin: tmc2209_stepper_y:virtual_endstop
homing_speed: 40
homing_retract_dist: 0

[tmc2209 stepper_y]
uart_pin: gpio9
interpolate: True
run_current: 0.8
sense_resistor: 0.110
stealthchop_threshold: 999999           # always StealthChop (old value 999999999999999, same effect)

#####################################################################
#   Probe: E3D PZ (the nozzle is the probe)
#####################################################################
[probe]
pin: !gpio19
x_offset: 0.0
y_offset: 0.0
speed: 5                         # D-134: 20 and 10 fire in mid-air on the left edge (Z resonance), 2.5 misses the bed
samples: 3
samples_tolerance: 0.3
sample_retract_dist: 3.0
samples_tolerance_retries: 5
lift_speed: 10
activate_gcode:
    G4 P500
    SET_TMC_CURRENT STEPPER=stepper_z CURRENT=0.4
deactivate_gcode:
    {% set run_current = printer.configfile.config['tmc2209 stepper_z'].run_current | float %}
    SET_TMC_CURRENT STEPPER=stepper_z CURRENT={run_current}

[stepper_z]
rotation_distance: 8
microsteps: 64
endstop_pin: probe:z_virtual_endstop
homing_speed: 5                   # D-140: 20 misses or fires late on long descents (Run 23), like probing (D-134)
second_homing_speed: 5
homing_retract_dist: 3.0

[tmc2209 stepper_z]
uart_pin: gpio9
interpolate: True
run_current: 0.6
hold_current: 0.50
sense_resistor: 0.110
stealthchop_threshold: 0

#####################################################################
#   Extruder: Galileo 2 standalone + Revo Voron 24 V 40 W
#####################################################################
[extruder]
microsteps: 16
rotation_distance: 47.088
gear_ratio: 9:1
step_pulse_duration: 0.000004
nozzle_diameter: 0.400
filament_diameter: 1.75
max_extrude_cross_section: 3
max_extrude_only_distance: 500
max_extrude_only_velocity: 120
pressure_advance: 0.025
pressure_advance_smooth_time: 0.03
heater_pin: gpio20
sensor_type: ATC Semitec 104NT-4-R025H42G   # Revo thermistor
sensor_pin: gpio28
max_power: 1.0
min_temp: 0                      # CHANGED from -50: a broken or unplugged sensor must stop the printer
max_temp: 300                    # Revo limit
min_extrude_temp: 150

[tmc2209 extruder]
uart_pin: gpio9
interpolate: False
run_current: 0.6
sense_resistor: 0.110
stealthchop_threshold: 0

#####################################################################
#   Bed
#####################################################################
[heater_bed]
heater_pin: gpio21
sensor_type: Generic 3950
sensor_pin: gpio29
smooth_time: 3.0
min_temp: 0                      # CHANGED from -50 (same reason as the nozzle)
max_temp: 120

#####################################################################
#   Fans
#####################################################################
[fan]
pin: gpio17
max_power: 1.0
kick_start_time: 0.5
off_below: 0.13
cycle_time: 0.010

[heater_fan hotend_fan]
pin: gpio16
# CHANGED: no tachometer_pin. The fan has a speed wire but it isn't connected (user 2026-10-07),
# so Klipper showed 0 rpm while the fan was spinning
max_power: 1.0
kick_start_time: 0.5
heater: extruder
heater_temp: 50.0

#####################################################################
#   Homing: sensorless X/Y, Z on the PZ probe at the back
#####################################################################
[homing_override]
axes: z
set_position_z: 0
gcode:
    G90
    G0 Z3 F300                   # small lift before moving, 5 mm/s like D-109's Z lifts (D-142)
    {% set spot = printer["gcode_macro _HOME_SPOT"] %}
    {% set home_all = 'X' not in params and 'Y' not in params and 'Z' not in params %}
    {% set home_x = home_all or 'X' in params %}
    {% set home_y = home_all or 'Y' in params %}
    {% set home_z = home_all or 'Z' in params %}
    {% set x_was_unhomed = not 'x' in printer.toolhead.homed_axes %}
    {% set y_was_unhomed = not 'y' in printer.toolhead.homed_axes %}
    {% if home_x or x_was_unhomed %}
        G28 X
    {% endif %}
    {% if home_y or y_was_unhomed %}
        G28 Y
    {% endif %}
    {% if home_z %}
        {% set cur_x = printer.toolhead.position[0] | float %}
        {% set cur_y = printer.toolhead.position[1] | float %}
        {% if home_all or x_was_unhomed or y_was_unhomed or cur_x < 0 or cur_x > spot.bed_x_max or cur_y < 0 or cur_y > spot.bed_y_max %}
            G0 X{spot.x} Y{spot.y} F6000     # this printer's homing spot (printer.cfg _HOME_SPOT)
        {% endif %}
        _PROBE_HOT
        G28 Z
        G0 Z3 F300
        _PROBE_HOT_END TARGET={printer.extruder.target}
    {% endif %}

#####################################################################
#   Bed mesh (the slicer runs BED_MESH_CALIBRATE after NOZZLE_CLEAN)
#####################################################################
[bed_mesh]
speed: 120
horizontal_move_z: 3
probe_count: 3, 3
mesh_pps: 2, 2
adaptive_margin: 5               # used by BED_MESH_CALIBRATE ADAPTIVE=1

#####################################################################
#   Pause / Resume / Cancel: Mainsail's macros with this printer's
#   park spot and lift (D-081). Replaces the old custom PAUSE, RESUME
#   and CANCEL_PRINT, which did the same minus the checks.
#####################################################################
[pause_resume]
recover_velocity: 100

[gcode_macro _CLIENT_VARIABLE]
variable_use_custom_pos   : True
variable_custom_park_dz   : 10.0           # lift 10 mm when pausing
variable_retract          : 1.0
variable_cancel_retract   : 5.0
variable_speed_retract    : 35.0
variable_unretract        : 1.0
variable_speed_unretract  : 35.0
variable_speed_hop        : 5.0  # mm/s Z hop on pause/cancel: quietest on the S1 (D-109, was 15)
variable_speed_move       : 100.0
variable_park_at_cancel   : True
variable_use_fw_retract   : False
variable_idle_timeout     : 0              # keep [idle_timeout] below while paused
variable_runout_sensor    : ""             # none fitted
variable_user_pause_macro : "_PRINTER_PAUSE_FAN"
variable_user_resume_macro: "_PRINTER_RESUME_FAN"
variable_user_cancel_macro: "_PRINTER_CANCEL_LIFT"
gcode:

[gcode_macro _PRINTER_PAUSE_FAN]
description: Pause: remember the part fan speed and turn it off (not a button)
variable_speed: 0.0
gcode:
    SET_GCODE_VARIABLE MACRO=_PRINTER_PAUSE_FAN VARIABLE=speed VALUE={printer.fan.speed}
    M107

[gcode_macro _PRINTER_RESUME_FAN]
description: Resume: put the part fan back to its speed before the pause (not a button)
gcode:
    _SS_RESUME_GUARD             # not while PRINT_START is still getting ready (D-089)
    {% set s = printer["gcode_macro _PRINTER_PAUSE_FAN"].speed | float %}
    {% if s > 0.01 %}
        M106 S{(s * 255) | round | int}
    {% endif %}
    SET_GCODE_VARIABLE MACRO=_PRINTER_PAUSE_FAN VARIABLE=speed VALUE=0.0

[gcode_macro _PRINTER_CANCEL_LIFT]
description: Cancel: lift up to 40 mm more so the print is easy to take off (not a button)
gcode:
    {% if 'z' in printer.toolhead.homed_axes %}
        {% set z = printer.toolhead.position.z | float %}
        {% set top = printer.toolhead.axis_maximum.z | float %}
        {% set target = [z + 40, top] | min %}
        {% if target > z %}
            G90
            G1 Z{target} F300            # 5 mm/s: 12 mm/s hits the S1's Z resonance (D-109)
        {% endif %}
    {% endif %}

[idle_timeout]
timeout: 900
gcode:
    {% if printer["gcode_macro PRINT_START"].stage %}
        # PRINT_START is waiting for a heater (the file is paused): it has its own time limit
    {% elif printer.pause_resume.is_paused %}
        # Paused and left alone: nozzle off only. The bed and motors stay on so the
        # print stays stuck down and in position; Resume reheats the nozzle.
        M104 S0
        RESPOND TYPE=error MSG="Paused for 15 minutes: nozzle heater turned off. Resume heats it again."
    {% else %}
        TURN_OFF_HEATERS
        M84
    {% endif %}

#####################################################################
#   This printer's macros (from the old macros.cfg)
#####################################################################
[gcode_macro CHANGE_FILAMENT]
description: Color change (called by the slicer): same as M600
gcode:
    M600

[gcode_macro NOZZLE_CLEAN]
description: Clean nozzle on the brush, then wait at 150°C for probing (WAIT=0: don't wait, PRINT_START does)
variable_wipe_count:  8
variable_wipe_dist_x: 15
variable_wipe_dist_y: 5
variable_clean_temp:  150        # E3D PZ: probe with the nozzle at about 150°C
gcode:
    {% if "xyz" not in printer.toolhead.homed_axes %}
        G28
    {% endif %}
    SAVE_GCODE_STATE NAME=STATE_NOZZLE_CLEAN
    G90
    G1 Z{brush_z + 3} F4000
    G1 X{brush_x} Y{brush_y} F10000
    G1 Z{brush_z} F2000
    {% for i in range(wipe_count) %}
        G1 X{brush_x - wipe_dist_x + i} F12000
        G1 X{brush_x + wipe_dist_x - i} F12000
    {% endfor %}
    G1 X{brush_x} F12000
    {% for i in range(wipe_count) %}
        G1 Y{brush_y - wipe_dist_y + i} F12000
        G1 Y{brush_y + wipe_dist_y - i} F12000
    {% endfor %}
    G1 Z{brush_z + 3} F2000
    M104 S{clean_temp}
    G1 X{park_x} Y{park_y} F10000
    G28 Z                        # re-home Z now that the nozzle is clean
    G4 P500
    G1 Z0 F1000
    {% if params.WAIT|default(1)|int %}
        M109 S{clean_temp}
    {% endif %}
    RESTORE_GCODE_STATE NAME=STATE_NOZZLE_CLEAN

# B-19, D-131: plastic on a cold nozzle cushions the PZ, so it misses triggers. Idle homing and
# bed mesh (touchscreen, Mainsail) heat to clean_temp first, then put the nozzle back as it was.
# Never during a print or pause: PRINT_START already probes hot and must never block on heat.
# The PZ is a piezo: a nozzle still heating or cooling makes it trigger in mid-air (Run 17: 4 retries
# each 2.5 mm higher at 135 → 150°C; steady at 150°C the same mesh passed first try). So wait for a
# steady clean_temp, like PRINT_START does, then hold settle_s.
[gcode_macro _PROBE_HOT]
description: Bring the nozzle to a steady clean_temp before idle Z homing or probing (not a button, B-19)
variable_settle_s: 15            # hold after reaching clean_temp ±2°C (heater overshoot is about 2°C)
gcode:
    {% set clean = printer["gcode_macro NOZZLE_CLEAN"].clean_temp|float %}
    {% set e = printer.extruder %}
    {% if printer.print_stats.state not in ['printing', 'paused'] %}
        {% if e.target != clean %}
            M104 S{clean}
        {% endif %}
        {% if e.target != clean or (e.temperature - clean)|abs > 2 %}
            M117 Nozzle to {clean|int}°C to probe
            TEMPERATURE_WAIT SENSOR=extruder MINIMUM={clean - 2} MAXIMUM={clean + 2}
            G4 P{settle_s * 1000}
            M117
        {% endif %}
    {% endif %}

[gcode_macro _PROBE_HOT_END]
description: Put the nozzle target back after _PROBE_HOT changed it (not a button, B-19)
gcode:
    # TARGET is the nozzle target from before _PROBE_HOT (the caller's template read it first)
    {% if printer.print_stats.state not in ['printing', 'paused'] %}
        M104 S{params.TARGET|float}
    {% endif %}

[gcode_macro BED_MESH_CALIBRATE]
rename_existing: BED_MESH_CALIBRATE_BASE
description: Bed mesh; idle with a cold nozzle it heats to clean_temp first (B-19)
gcode:
    {% if params.METHOD|default('')|lower == 'manual' %}
        BED_MESH_CALIBRATE_BASE {rawparams}
    {% else %}
        _PROBE_HOT
        BED_MESH_CALIBRATE_BASE {rawparams}
        _PROBE_HOT_END TARGET={printer.extruder.target}
    {% endif %}

[force_move]
enable_force_move: True   # walk-away load: LOAD_FILAMENT GRAB=1 pulls filament in while cold (D-116)

