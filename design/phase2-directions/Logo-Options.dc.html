<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Logo on dark – options</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;600;800;900&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#00ACC7}a:hover{color:#88D8F2}
</style>
</helmet>
<div style="width: 980px; height: 360px; box-sizing: border-box; padding: 20px; background: #161616; color: #FAFAFA; font-family: 'Public Sans', system-ui, sans-serif; display: flex; gap: 20px">
  <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; width: 440px">
    <figure style="margin: 0; display: flex; flex-direction: column; gap: 8px">
      <div style="height: 200px; background: #0A0A0A; border-radius: 10px; display: flex; align-items: center; justify-content: center">
        <img src="/_blob/8f67a68a359635a2ccecc7b98ea7e1c9" alt="Star mark on black" style="width: 54px; height: 61px; object-fit: contain">
      </div>
      <figcaption style="font-size: 12px; line-height: 1.35"><b>0 · As is</b><br><span style="color: #A1A1A1">Bottom star lost</span></figcaption>
    </figure>
    <figure style="margin: 0; display: flex; flex-direction: column; gap: 8px">
      <div style="height: 200px; background: #0A0A0A; border-radius: 10px; display: flex; align-items: center; justify-content: center">
        <div style="width: 76px; height: 76px; border-radius: 10px; background: #FAFAFA; display: flex; align-items: center; justify-content: center"><img src="/_blob/8f67a68a359635a2ccecc7b98ea7e1c9" alt="Star mark on white plate" style="width: 50px; height: 56px; object-fit: contain"></div>
      </div>
      <figcaption style="font-size: 12px; line-height: 1.35"><b>1 · White plate</b><br><span style="color: #A1A1A1">Square, 10px radius</span></figcaption>
    </figure>
    <figure style="margin: 0; display: flex; flex-direction: column; gap: 8px">
      <div style="height: 200px; background: #0A0A0A; border-radius: 10px; display: flex; align-items: center; justify-content: center">
        <div style="width: 76px; height: 76px; border-radius: 10px; background: #E3F6FC; display: flex; align-items: center; justify-content: center"><img src="/_blob/8f67a68a359635a2ccecc7b98ea7e1c9" alt="Star mark on pale sky plate" style="width: 50px; height: 56px; object-fit: contain"></div>
      </div>
      <figcaption style="font-size: 12px; line-height: 1.35"><b>2 · Pale sky plate</b><br><span style="color: #A1A1A1">Tinted, softer</span></figcaption>
    </figure>
    <figure style="margin: 0; display: flex; flex-direction: column; gap: 8px">
      <div style="height: 200px; background: #0A0A0A; border-radius: 10px; display: flex; align-items: center; justify-content: center">
        <div style="width: 80px; height: 80px; border-radius: 50%; background: #FAFAFA; display: flex; align-items: center; justify-content: center"><img src="/_blob/8f67a68a359635a2ccecc7b98ea7e1c9" alt="Star mark on white circle" style="width: 48px; height: 54px; object-fit: contain"></div>
      </div>
      <figcaption style="font-size: 12px; line-height: 1.35"><b>3 · White circle</b><br><span style="color: #A1A1A1">Badge style</span></figcaption>
    </figure>
  </div>
  <div style="display: flex; flex-direction: column; gap: 8px">
    <div style="width: 480px; height: 290px; border-radius: 10px; background: #0A0A0A; overflow: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px">
      <div style="background: #FAFAFA; border-radius: 10px; padding: 18px 24px"><img src="/_blob/0c4ed85685a9ebe9b975496f2dff5c07" alt="StarStack logo" style="width: 300px; height: 68px; object-fit: contain; display: block"></div>
      <div style="width: 160px; height: 4px; border-radius: 2px; background: #282828; overflow: hidden"><div style="width: 45%; height: 100%; background: #00ACC7"></div></div>
      <div style="font-size: 12px; color: #A1A1A1">Starting printer…</div>
    </div>
    <div style="font-size: 12px; line-height: 1.35"><b>Boot screen</b> <span style="color: #A1A1A1">· logo2 on a white plate (480 × 320)</span></div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":980,"height":360}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
