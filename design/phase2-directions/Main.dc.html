<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>A Soft Cards – Home idle</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;600;800;900&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#00ACC7}a:hover{color:#88D8F2}
button{font-family:inherit;cursor:pointer}
</style>
</helmet>
<div style="width: 480px; height: 320px; display: flex; background: #0A0A0A; color: #FAFAFA; font-family: 'Public Sans', system-ui, sans-serif; overflow: hidden">
  <nav aria-label="Main" style="width: 64px; flex-shrink: 0; background: #111111; display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 8px 0; box-sizing: border-box">
    <div style="width: 36px; height: 36px; border-radius: 10px; background: #FAFAFA; display: flex; align-items: center; justify-content: center; margin-bottom: 4px">
      <img src="/_blob/8f67a68a359635a2ccecc7b98ea7e1c9" alt="StarStack" style="width: 24px; height: 27px; object-fit: contain">
    </div>
    <button aria-label="Home" style="width: 48px; height: 44px; border: 0; border-radius: 10px; background: #0D3C96; color: #FAFAFA; display: flex; align-items: center; justify-content: center">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/><path d="M10 20v-6h4v6"/></svg>
    </button>
    <button aria-label="Print" style="width: 48px; height: 44px; border: 0; border-radius: 10px; background: transparent; color: #A1A1A1; display: flex; align-items: center; justify-content: center">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 8h6M9 12h6M9 16h4"/></svg>
    </button>
    <button aria-label="Controls" style="width: 48px; height: 44px; border: 0; border-radius: 10px; background: transparent; color: #A1A1A1; display: flex; align-items: center; justify-content: center">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>
    </button>
    <button aria-label="Settings" style="width: 48px; height: 44px; border: 0; border-radius: 10px; background: transparent; color: #A1A1A1; display: flex; align-items: center; justify-content: center">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9L7 7M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/></svg>
    </button>
    <div style="flex-grow: 1"></div>
    <button aria-label="Emergency stop" style="width: 48px; height: 44px; border: 0; border-radius: 10px; background: #E7000B; color: #FFFFFF; display: flex; align-items: center; justify-content: center">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3h8l5 5v8l-5 5H8l-5-5V8z"/><path d="M12 8v5M12 16.5v.01"/></svg>
    </button>
  </nav>
  <main style="flex-grow: 1; padding: 12px; box-sizing: border-box; display: flex; flex-direction: column; gap: 10px; min-width: 0">
    <div style="display: flex; align-items: center; gap: 8px; height: 28px">
      <div style="display: flex; align-items: center; gap: 6px; background: #161616; border-radius: 999px; padding: 4px 10px; font-size: 12px; font-weight: 600">
        <span style="width: 8px; height: 8px; border-radius: 50%; background: #5CA300"></span>Ready
      </div>
      <div style="flex-grow: 1"></div>
      <div style="display: flex; align-items: center; gap: 4px; font-size: 13px; color: #A1A1A1">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3h8v6H8z"/><path d="M10 9v4l2 3 2-3V9"/></svg><span style="color: #FAFAFA; font-weight: 600">24°</span>
      </div>
      <div style="display: flex; align-items: center; gap: 4px; font-size: 13px; color: #A1A1A1; margin-left: 8px">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 18h18"/><path d="M7 14c1-1.5 1-3 0-4.5M12 14c1-1.5 1-3 0-4.5M17 14c1-1.5 1-3 0-4.5"/></svg><span style="color: #FAFAFA; font-weight: 600">23°</span>
      </div>
    </div>
    <section style="background: #161616; border-radius: 10px; padding: 12px; display: flex; gap: 12px; align-items: stretch">
      <div style="width: 112px; height: 112px; border-radius: 10px; background: #1F1F1F; display: flex; align-items: center; justify-content: center; flex-shrink: 0">
        <svg width="76" height="76" viewBox="0 0 80 80" fill="none" stroke="#00ACC7" stroke-width="2" stroke-linejoin="round"><path d="M10 50l40-22 20 10-40 22z" fill="#00ACC7" fill-opacity="0.18"/><path d="M10 50v6l20 10v-6"/><path d="M30 66l40-22v-6"/><path d="M52 30l6-14 6 3-4 15"/></svg>
      </div>
      <div style="display: flex; flex-direction: column; gap: 4px; min-width: 0; flex-grow: 1">
        <div style="font-size: 11px; font-weight: 600; color: #A1A1A1; text-transform: uppercase; letter-spacing: 0.06em">Last print</div>
        <div style="font-size: 17px; font-weight: 800; line-height: 1.2">Tire Monkey straight handle</div>
        <div style="font-size: 13px; color: #A1A1A1">PETG · 40 min · 11 g</div>
        <div style="flex-grow: 1"></div>
        <button style="height: 44px; border: 0; border-radius: 10px; background: #0D3C96; color: #FAFAFA; font-size: 15px; font-weight: 800; display: flex; align-items: center; justify-content: center; gap: 8px">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12a8 8 0 1 0 2.3-5.6"/><path d="M4 4v4h4"/></svg>Print again
        </button>
      </div>
    </section>
    <div style="font-size: 11px; font-weight: 600; color: #A1A1A1; text-transform: uppercase; letter-spacing: 0.06em; margin-top: 2px">Preheat</div>
    <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px">
      <button style="height: 60px; border: 0; border-radius: 10px; background: #161616; color: #FAFAFA; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px"><span style="font-size: 15px; font-weight: 800">PLA</span><span style="font-size: 11px; color: #A1A1A1">210° / 60°</span></button>
      <button style="height: 60px; border: 0; border-radius: 10px; background: #161616; color: #FAFAFA; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px"><span style="font-size: 15px; font-weight: 800">PETG</span><span style="font-size: 11px; color: #A1A1A1">240° / 80°</span></button>
      <button style="height: 60px; border: 0; border-radius: 10px; background: #161616; color: #FAFAFA; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px"><span style="font-size: 15px; font-weight: 800">TPU</span><span style="font-size: 11px; color: #A1A1A1">225° / 40°</span></button>
      <button style="height: 60px; border: 1px solid #282828; border-radius: 10px; background: transparent; color: #88D8F2; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 2v20M4 7l16 10M20 7L4 17"/></svg><span style="font-size: 11px; font-weight: 600">Cool down</span></button>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":480,"height":320}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
