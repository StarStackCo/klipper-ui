# =====================================================================
#  StarStack macros v1: the buttons behind the TFT and Mainsail UI
#  Repo: StarStackCo/klipper-ui  ·  macros/starstack_macros.cfg
#
#  Needs in printer.cfg:
#    [save_variables]
#    filename: ~/printer_data/config/variables.cfg
#    [include starstack_macros.cfg]
#
#  SAFETY RULES these macros follow (checklist S5/S6):
#  - Never change max_temp, min_extrude_temp, verify_heater or endstops.
#    Klipper's own limits always have the final say.
#  - Never block the G-code queue waiting for heat (no M109/TEMPERATURE_WAIT):
#    if the nozzle is cold, start heating and ask to run again.
#  - Filament moves are refused while printing (allowed when paused).
#  - A filament change left unfinished turns its heater off after
#    heat_timeout seconds (when not printing or paused).
#  - Flow is clamped to 40-120 %.
# =====================================================================

[gcode_macro _SS]
description: StarStack constants (not a button)
# material: [nozzle °C, bed °C]
variable_materials: {'PLA': [210, 60], 'PETG': [240, 80], 'TPU': [225, 40]}
variable_load_mm: 50          # extruder gears → nozzle (S1: Galileo 2 + Revo, old macros)
variable_purge_mm: 60
variable_unload_mm: 100
variable_load_speed: 600      # mm/min
variable_purge_speed: 300
variable_unload_speed: 1800
variable_tpu_speed: 120       # TPU loads/unloads slowly to avoid buckling
variable_heat_timeout: 300    # s before an abandoned filament heater turns off
variable_flow_min: 40
variable_flow_max: 120
gcode:
  RESPOND MSG="StarStack constants: see starstack_macros.cfg"

# ---------------------------------------------------------------------
# Print speed presets (speed % only, M220)
# ---------------------------------------------------------------------
[gcode_macro SPEED_SILENT]
description: Print speed 50% (quiet)
gcode:
  M220 S50
  RESPOND MSG="Speed: Silent (50%)"

[gcode_macro SPEED_NORMAL]
description: Print speed 100%
gcode:
  M220 S100
  RESPOND MSG="Speed: Normal (100%)"

[gcode_macro SPEED_FAST]
description: Print speed 125%
gcode:
  M220 S125
  RESPOND MSG="Speed: Fast (125%)"

[gcode_macro SPEED_DRAFT]
description: Print speed 150%
gcode:
  M220 S150
  RESPOND MSG="Speed: Draft (150%)"

# ---------------------------------------------------------------------
# Flow (40-120 %)
# ---------------------------------------------------------------------
[gcode_macro SET_FLOW]
description: Set flow %, limited to 40-120. Usage: SET_FLOW PERCENT=100
gcode:
  {% set s = printer["gcode_macro _SS"] %}
  {% set want = params.PERCENT|default(100)|int %}
  {% set pct = [s.flow_min, [want, s.flow_max]|min]|max %}
  M221 S{pct}
  {% if pct != want %}
    RESPOND TYPE=error MSG="Flow limited to {pct}% (allowed {s.flow_min}-{s.flow_max}%)"
  {% else %}
    RESPOND MSG="Flow: {pct}%"
  {% endif %}

[gcode_macro FLOW_ADJUST]
description: Change flow by DELTA % (e.g. DELTA=1, DELTA=-5)
gcode:
  {% set cur = (printer.gcode_move.extrude_factor * 100)|round|int %}
  SET_FLOW PERCENT={cur + params.DELTA|default(0)|int}

# ---------------------------------------------------------------------
# Preheat / cool down
# ---------------------------------------------------------------------
[gcode_macro PREHEAT]
description: Heat nozzle and bed for MATERIAL=PLA|PETG|TPU (doesn't wait)
gcode:
  {% set mats = printer["gcode_macro _SS"].materials %}
  {% set m = params.MATERIAL|default('')|upper %}
  {% if printer.print_stats.state == 'printing' %}
    RESPOND TYPE=error MSG="Preheat is off while printing. Change temperatures in Tune instead."
  {% elif m not in mats %}
    RESPOND TYPE=error MSG="Unknown material '{m}'. Use PLA, PETG or TPU."
  {% else %}
    M104 S{mats[m][0]}
    M140 S{mats[m][1]}
    RESPOND MSG="Preheating for {m}: nozzle {mats[m][0]}°C, bed {mats[m][1]}°C"
  {% endif %}

[gcode_macro PREHEAT_PLA]
description: Preheat for PLA (210°C / 60°C)
gcode:
  PREHEAT MATERIAL=PLA

[gcode_macro PREHEAT_PETG]
description: Preheat for PETG (240°C / 80°C)
gcode:
  PREHEAT MATERIAL=PETG

[gcode_macro PREHEAT_TPU]
description: Preheat for TPU (225°C / 40°C)
gcode:
  PREHEAT MATERIAL=TPU

[gcode_macro COOL_DOWN]
description: Turn off all heaters and the part fan (not while printing)
gcode:
  {% if printer.print_stats.state == 'printing' %}
    RESPOND TYPE=error MSG="Can't cool down while printing. Pause or cancel first."
  {% else %}
    UPDATE_DELAYED_GCODE ID=_SS_FIL_TIMEOUT DURATION=0
    TURN_OFF_HEATERS
    M106 S0
    RESPOND MSG="Cooling down: heaters and part fan off"
  {% endif %}

# ---------------------------------------------------------------------
# Filament: load / purge / unload, with the loaded material remembered
# ---------------------------------------------------------------------
[gcode_macro LOAD_FILAMENT]
description: Load MATERIAL=PLA|PETG|TPU. Heats first if cold: run again when hot.
gcode:
  {% set s = printer["gcode_macro _SS"] %}
  {% set m = params.MATERIAL|default('')|upper %}
  {% if printer.print_stats.state == 'printing' %}
    RESPOND TYPE=error MSG="Filament is locked while printing. Pause first."
  {% elif m not in s.materials %}
    RESPOND TYPE=error MSG="Pick a material: LOAD_FILAMENT MATERIAL=PLA|PETG|TPU"
  {% else %}
    {% set t = s.materials[m][0] %}
    M104 S{t}
    UPDATE_DELAYED_GCODE ID=_SS_FIL_TIMEOUT DURATION={s.heat_timeout}
    {% if printer.extruder.temperature < t - 5 %}
      RESPOND MSG="Heating to {t}°C for {m}. Run Load again when the nozzle is hot."
    {% else %}
      {% set f = s.tpu_speed if m == 'TPU' else s.load_speed %}
      {% set fp = s.tpu_speed if m == 'TPU' else s.purge_speed %}
      SAVE_GCODE_STATE NAME=_ss_fil
      M83
      G1 E{s.load_mm} F{f}
      G1 E{s.purge_mm} F{fp}
      RESTORE_GCODE_STATE NAME=_ss_fil
      SAVE_VARIABLE VARIABLE=loaded_material VALUE='"{m}"'
      RESPOND MSG="{m} loaded. Purge more if the color isn't clean, then Done."
    {% endif %}
  {% endif %}

[gcode_macro PURGE_MORE]
description: Push out more filament (nozzle must already be hot)
gcode:
  {% set s = printer["gcode_macro _SS"] %}
  {% if printer.print_stats.state == 'printing' %}
    RESPOND TYPE=error MSG="Filament is locked while printing."
  {% elif not printer.extruder.can_extrude %}
    RESPOND TYPE=error MSG="Nozzle is too cold to purge."
  {% else %}
    UPDATE_DELAYED_GCODE ID=_SS_FIL_TIMEOUT DURATION={s.heat_timeout}
    SAVE_GCODE_STATE NAME=_ss_fil
    M83
    G1 E{s.purge_mm} F{s.purge_speed}
    RESTORE_GCODE_STATE NAME=_ss_fil
  {% endif %}

[gcode_macro UNLOAD_FILAMENT]
description: Unload the loaded filament (or MATERIAL=...). Heats first if cold: run again when hot.
gcode:
  {% set s = printer["gcode_macro _SS"] %}
  {% set saved = printer.save_variables.variables.loaded_material|default('NONE') %}
  {% set m = params.MATERIAL|default(saved)|upper %}
  {% if printer.print_stats.state == 'printing' %}
    RESPOND TYPE=error MSG="Filament is locked while printing. Pause first."
  {% elif m not in s.materials %}
    RESPOND TYPE=error MSG="No filament recorded as loaded. Use UNLOAD_FILAMENT MATERIAL=PLA|PETG|TPU"
  {% else %}
    {% set t = s.materials[m][0] %}
    M104 S{t}
    UPDATE_DELAYED_GCODE ID=_SS_FIL_TIMEOUT DURATION={s.heat_timeout}
    {% if printer.extruder.temperature < t - 5 %}
      RESPOND MSG="Heating to {t}°C to unload {m}. Run Unload again when the nozzle is hot."
    {% else %}
      {% set f = s.tpu_speed * 5 if m == 'TPU' else s.unload_speed %}
      SAVE_GCODE_STATE NAME=_ss_fil
      M83
      G1 E5 F{s.purge_speed}
      G1 E-{s.unload_mm} F{f}
      RESTORE_GCODE_STATE NAME=_ss_fil
      SAVE_VARIABLE VARIABLE=loaded_material VALUE='"NONE"'
      RESPOND MSG="{m} unloaded. Pull the filament out gently, then Done."
    {% endif %}
  {% endif %}

[gcode_macro FILAMENT_DONE]
description: Finish a filament change: heater off (kept on if a print is paused)
gcode:
  UPDATE_DELAYED_GCODE ID=_SS_FIL_TIMEOUT DURATION=0
  {% if printer.print_stats.state in ['printing', 'paused'] %}
    RESPOND MSG="Filament change done. Heater kept on for the paused print."
  {% else %}
    M104 S0
    RESPOND MSG="Filament change done. Nozzle heater off."
  {% endif %}

[delayed_gcode _SS_FIL_TIMEOUT]
gcode:
  {% if printer.print_stats.state not in ['printing', 'paused'] %}
    M104 S0
    RESPOND TYPE=error MSG="Nozzle heater turned off: the filament change was left unfinished."
  {% endif %}

# ---------------------------------------------------------------------
# Filament runout (called by [filament_switch_sensor] runout_gcode,
# after pause_on_runout has already paused the print)
# ---------------------------------------------------------------------
[gcode_macro _SS_RUNOUT]
description: Runout handler (not a button)
gcode:
  SAVE_VARIABLE VARIABLE=loaded_material VALUE='"NONE"'
  RESPOND TYPE=error MSG="Filament ran out. Print paused: load new filament, then Resume."

# ---------------------------------------------------------------------
# Color change (OrcaSlicer: Printer settings > Machine G-code >
# "Change filament G-code" = M600). Pauses the print; the touchscreen
# shows "Color change" and a guided Change filament flow.
# ---------------------------------------------------------------------
[gcode_macro M600]
description: Color change: pause so the next color can be loaded
gcode:
  {% if printer.pause_resume.is_paused %}
    RESPOND MSG="Color change requested, but the print is already paused."
  {% else %}
    PAUSE
    RESPOND TYPE=error MSG="Color change: change filament, then Resume."
  {% endif %}
