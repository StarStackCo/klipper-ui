# =====================================================================
#  StarStack macros v1.3: the buttons behind the TFT and Mainsail UI
#  Repo: StarStackCo/klipper-ui  ·  macros/starstack_macros.cfg
#
#  Needs in printer.cfg:
#    [save_variables]
#    filename: ~/printer_data/config/variables.cfg
#    [include starstack_macros.cfg]
#
#  SAFETY RULES these macros follow (checklist S5/S6):
#  - Never change max_temp, min_extrude_temp, verify_heater or endstops.
#    Klipper's own limits always have the final say.
#  - Never block the G-code queue waiting for heat (no M109/M190/TEMPERATURE_WAIT):
#    if the nozzle is cold, start heating and ask to run again. PRINT_START heats
#    with the file paused and a 1 s timer, so cancel always works at once.
#  - Every PRINT_START heating step has a time limit; missing it cancels the print.
#  - Filament moves are refused while printing (allowed when paused).
#  - A filament change left unfinished turns its heater off after
#    heat_timeout seconds (when not printing or paused).
#  - Flow is clamped to 40-120 %.
# =====================================================================

[gcode_macro _SS]
description: StarStack constants (not a button)
# material: [nozzle °C, bed °C]
variable_materials: {'PLA': [210, 60], 'PETG': [240, 80], 'TPU': [225, 50]}
variable_load_mm: 50          # extruder gears → nozzle (S1: Galileo 2 + Revo, old macros)
variable_purge_mm: 40          # was 60: a little too much (user, D-097)
variable_load_retract_mm: 1.0  # pulled back after every load/purge so the nozzle doesn't ooze
variable_unload_tip_mm: 3      # unload: short fast push first, so the tip pulls out clean
variable_unload_tip_speed: 1200  # mm/min
variable_unload_mm: 100
variable_load_speed: 600      # mm/min
variable_purge_speed: 300
variable_unload_speed: 1800
variable_tpu_speed: 120       # TPU loads/unloads slowly to avoid buckling
variable_heat_timeout: 300    # s before an abandoned filament heater turns off
variable_flow_min: 40
variable_flow_max: 120
variable_start_heat_timeout: 600  # s per PRINT_START heating step before the print is canceled
variable_start_soften_drop: 20    # PRINT_START heats the nozzle this much below print temp to clean it
variable_start_park: [0, 0, 15]   # X, Y, Z: wait here for print temperature (purge line starts nearby)
# PRINT_START heat soak (D-096): s the bed stays at temperature before the bed mesh, per loaded
# material. Nozzle heating, homing and cleaning happen during it. Skipped when the bed is already
# within start_soak_warm °C of its target at the start (e.g. a reprint right after a print).
variable_start_soak: {'PLA': 0, 'PETG': 300, 'TPU': 0}
variable_start_soak_warm: 10
variable_start_retries: 2         # PRINT_START: tries again after a failed homing/probing/mesh step (D-105)
variable_mesh_warn: 1.5           # mm bed mesh range: above this the print goes on with a warning (D-105)
variable_mesh_stop: 3.0           # mm: above this something is badly off, the print is canceled
variable_printer_names: ['starstack']   # PRINT_START PRINTER= must contain one of these (D-106)
variable_nozzles: [0.25, 0.4, 0.5, 0.6, 0.8]  # sizes SET_NOZZLE accepts
variable_start_fail_test: ''      # TESTS ONLY: home_xy | home_z | clean | mesh makes that step fail on
                                  # purpose; add _once to fail only the first try. Set with
                                  # SET_GCODE_VARIABLE MACRO=_SS VARIABLE=start_fail_test VALUE='"home_z"'
gcode:
  RESPOND MSG="StarStack constants: see starstack_macros.cfg"

# ---------------------------------------------------------------------
# Print speed presets. Silent (D-101) is more than 50 % speed: the slicer
# sets the acceleration for every feature (SET_VELOCITY_LIMIT ACCEL=2000
# thousands of times a print) and asks for 400 mm/s travel, which the
# speed factor alone never brings below the printer's 200 mm/s limit. So
# Silent also caps speed, acceleration and corner speed, and the wrappers
# below keep the file from raising them again until another preset is
# picked. The other presets only change the speed factor (as before).
# ---------------------------------------------------------------------
[gcode_macro _SS_SPEED]
description: Speed preset state (not a button)
variable_mode: 'normal'          # normal | silent
variable_last_state: ''          # print state seen by _SS_SPEED_WATCH ('' = Klipper just started)
variable_silent: {'velocity': 100, 'accel': 800, 'corner': 3, 'fan': 30}   # caps while Silent
# fan: % the part fan runs at whenever it is on in Silent (user: quietest at 30 %, D-103)
gcode:
  RESPOND MSG="Speed preset: {printer['gcode_macro _SS_SPEED'].mode}"

[gcode_macro _SS_SPEED_MODE]
description: Switch the Silent caps on or off (not a button)
gcode:
  {% set mode = params.MODE|default('normal') %}
  {% set c = printer["gcode_macro _SS_SPEED"].silent %}
  {% set cfg = printer.configfile.settings.printer %}
  {% set th = printer.toolhead %}
  {% set was = printer["gcode_macro _SS_SPEED"].mode %}
  SET_GCODE_VARIABLE MACRO=_SS_SPEED VARIABLE=mode VALUE='"{mode}"'
  {% if mode == 'silent' %}
    _SS_VELOCITY_LIMIT_BASE VELOCITY={[th.max_velocity, c.velocity]|min} ACCEL={[th.max_accel, c.accel]|min} SQUARE_CORNER_VELOCITY={[th.square_corner_velocity, c.corner]|min}
    {% if printer.fan.speed > 0 %}
      M106.1 S{(c.fan * 2.55)|round|int}
    {% endif %}
  {% else %}
    # back to the printer's limits; the file sets its own acceleration again at the next feature
    _SS_VELOCITY_LIMIT_BASE VELOCITY={cfg.max_velocity} ACCEL={cfg.max_accel} SQUARE_CORNER_VELOCITY={cfg.square_corner_velocity}
    {% if was == 'silent' %}
      # the fan speed the file last asked for
      M106.1 S{printer["gcode_macro M106"].requested|int}
    {% endif %}
  {% endif %}

[gcode_macro M106]
description: Klipper's M106 (part fan); while Silent is on, any fan-on runs at the quiet speed (D-103)
rename_existing: M106.1
variable_requested: 0      # last speed asked for (0-255), restored when Silent ends
gcode:
  {% set want = params.S|default(255)|float %}
  {% set sp = printer["gcode_macro _SS_SPEED"] %}
  SET_GCODE_VARIABLE MACRO=M106 VARIABLE=requested VALUE={want}
  {% if sp.mode == 'silent' and want > 0 %}
    M106.1 S{(sp.silent.fan * 2.55)|round|int}
  {% else %}
    M106.1 S{want}
  {% endif %}

[gcode_macro SET_VELOCITY_LIMIT]
description: Klipper's SET_VELOCITY_LIMIT, capped while the Silent preset is on (D-101)
rename_existing: _SS_VELOCITY_LIMIT_BASE
gcode:
  {% set sp = printer["gcode_macro _SS_SPEED"] %}
  {% set c = sp.silent %}
  {% set caps = {'VELOCITY': c.velocity, 'ACCEL': c.accel, 'ACCEL_TO_DECEL': c.accel / 2,
                 'SQUARE_CORNER_VELOCITY': c.corner} %}
  {% set args = [] %}
  {% for k, v in params.items() %}
    {% set capped = sp.mode == 'silent' and k in caps %}
    {% set _ = args.append(k ~ "=" ~ ([v|float, caps[k]]|min if capped else v)) %}
  {% endfor %}
  _SS_VELOCITY_LIMIT_BASE {args|join(" ")}

[gcode_macro M204]
description: Klipper's M204 (acceleration), capped while the Silent preset is on (D-101)
rename_existing: M204.1
gcode:
  {% set sp = printer["gcode_macro _SS_SPEED"] %}
  {% set args = [] %}
  {% for k, v in params.items() %}
    {% set capped = sp.mode == 'silent' and k in ['S', 'P', 'T'] %}
    {% set _ = args.append(k ~ ([v|float, sp.silent.accel]|min if capped else v)) %}
  {% endfor %}
  M204.1 {args|join(" ")}

[gcode_macro SET_DEFAULT_SPEED]
description: Speed preset used when no print runs and after every print: SET_DEFAULT_SPEED MODE=silent|normal|fast|draft
gcode:
  {% set m = params.MODE|default('')|lower %}
  {% if m not in ['silent', 'normal', 'fast', 'draft'] %}
    RESPOND TYPE=error MSG="Use SET_DEFAULT_SPEED MODE=silent, normal, fast or draft"
  {% else %}
    SAVE_VARIABLE VARIABLE=default_speed VALUE='"{m}"'
    RESPOND MSG="Default speed: {m|capitalize}. Used after every print (and now, unless a print is running)."
    {% if printer.print_stats.state not in ['printing', 'paused'] %}
      _SS_SPEED_DEFAULT
    {% endif %}
  {% endif %}

[gcode_macro _SS_SPEED_DEFAULT]
description: Apply the default speed preset (not a button, D-104)
gcode:
  {% set m = printer.save_variables.variables.default_speed|default('normal') %}
  {% set m = m if m in ['silent', 'normal', 'fast', 'draft'] else 'normal' %}
  # after a print the part fan is off: leaving Silent must not bring the file's last speed back
  SET_GCODE_VARIABLE MACRO=M106 VARIABLE=requested VALUE=0
  SPEED_{m|upper}

# Back to the default speed whenever a print ends (done, canceled or error) and when Klipper
# starts. Klipper keeps the speed and limits otherwise, so the next print would start in the last
# print's preset (user, D-104). Nothing changes at the start of a print.
[delayed_gcode _SS_SPEED_WATCH]
initial_duration: 3
gcode:
  {% set st = printer.print_stats.state %}
  {% set was = printer["gcode_macro _SS_SPEED"].last_state %}
  {% if was == '' or (was in ['printing', 'paused'] and st not in ['printing', 'paused']) %}
    _SS_SPEED_DEFAULT
  {% endif %}
  {% if st != was %}
    SET_GCODE_VARIABLE MACRO=_SS_SPEED VARIABLE=last_state VALUE='"{st}"'
  {% endif %}
  UPDATE_DELAYED_GCODE ID=_SS_SPEED_WATCH DURATION=5

[gcode_macro SPEED_SILENT]
description: Print speed 50%, max 100 mm/s, gentle acceleration (quiet)
gcode:
  M220 S50
  _SS_SPEED_MODE MODE=silent
  {% set c = printer["gcode_macro _SS_SPEED"].silent %}
  RESPOND MSG="Speed: Silent (50%, max {c.velocity} mm/s, acceleration {c.accel}, part fan {c.fan}% when on)"

[gcode_macro SPEED_NORMAL]
description: Print speed 100%
gcode:
  M220 S100
  _SS_SPEED_MODE MODE=normal
  RESPOND MSG="Speed: Normal (100%)"

[gcode_macro SPEED_FAST]
description: Print speed 125%
gcode:
  M220 S125
  _SS_SPEED_MODE MODE=normal
  RESPOND MSG="Speed: Fast (125%)"

[gcode_macro SPEED_DRAFT]
description: Print speed 150%
gcode:
  M220 S150
  _SS_SPEED_MODE MODE=normal
  RESPOND MSG="Speed: Draft (150%)"

# ---------------------------------------------------------------------
# Flow (40-120 %)
# ---------------------------------------------------------------------
[gcode_macro SET_FLOW]
description: Set flow %, limited to 40-120. Usage: SET_FLOW PERCENT=100
gcode:
  {% set s = printer["gcode_macro _SS"] %}
  {% set want = params.PERCENT|default(100)|int %}
  {% set pct = [s.flow_min, [want, s.flow_max]|min]|max %}
  M221 S{pct}
  {% if pct != want %}
    RESPOND TYPE=error MSG="Flow limited to {pct}% (allowed {s.flow_min}-{s.flow_max}%)"
  {% else %}
    RESPOND MSG="Flow: {pct}%"
  {% endif %}

[gcode_macro FLOW_ADJUST]
description: Change flow by DELTA % (e.g. DELTA=1, DELTA=-5)
gcode:
  {% set cur = (printer.gcode_move.extrude_factor * 100)|round|int %}
  SET_FLOW PERCENT={cur + params.DELTA|default(0)|int}

# ---------------------------------------------------------------------
# Preheat / cool down
# ---------------------------------------------------------------------
[gcode_macro PREHEAT]
description: Heat nozzle and bed for MATERIAL=PLA|PETG|TPU (doesn't wait)
gcode:
  {% set mats = printer["gcode_macro _SS"].materials %}
  {% set m = params.MATERIAL|default('')|upper %}
  {% if printer.print_stats.state == 'printing' %}
    RESPOND TYPE=error MSG="Preheat is off while printing. Change temperatures in Tune instead."
  {% elif m not in mats %}
    RESPOND TYPE=error MSG="Unknown material '{m}'. Use PLA, PETG or TPU."
  {% else %}
    M104 S{mats[m][0]}
    M140 S{mats[m][1]}
    RESPOND MSG="Preheating for {m}: nozzle {mats[m][0]}°C, bed {mats[m][1]}°C"
  {% endif %}

[gcode_macro PREHEAT_PLA]
description: Preheat for PLA (210°C / 60°C)
gcode:
  PREHEAT MATERIAL=PLA

[gcode_macro PREHEAT_PETG]
description: Preheat for PETG (240°C / 80°C)
gcode:
  PREHEAT MATERIAL=PETG

[gcode_macro PREHEAT_TPU]
description: Preheat for TPU (225°C / 50°C)
gcode:
  PREHEAT MATERIAL=TPU

[gcode_macro COOL_DOWN]
description: Turn off all heaters and the part fan (not while printing)
gcode:
  {% if printer.print_stats.state == 'printing' %}
    RESPOND TYPE=error MSG="Can't cool down while printing. Pause or cancel first."
  {% else %}
    UPDATE_DELAYED_GCODE ID=_SS_FIL_TIMEOUT DURATION=0
    TURN_OFF_HEATERS
    M106 S0
    RESPOND MSG="Cooling down: heaters and part fan off"
  {% endif %}

# ---------------------------------------------------------------------
# Filament: load / purge / unload, with the loaded material remembered
# ---------------------------------------------------------------------
[gcode_macro LOAD_FILAMENT]
description: Load MATERIAL=PLA|PETG|TPU. Heats first if cold: run again when hot. HEAT=1: only heat.
gcode:
  {% set s = printer["gcode_macro _SS"] %}
  {% set m = params.MATERIAL|default('')|upper %}
  {% if printer.print_stats.state == 'printing' %}
    RESPOND TYPE=error MSG="Filament is locked while printing. Pause first."
  {% elif m not in s.materials %}
    RESPOND TYPE=error MSG="Pick a material: LOAD_FILAMENT MATERIAL=PLA|PETG|TPU"
  {% else %}
    {% set t = s.materials[m][0] %}
    M104 S{t}
    UPDATE_DELAYED_GCODE ID=_SS_FIL_TIMEOUT DURATION={s.heat_timeout}
    {% if params.HEAT|default(0)|int %}
      # the touchscreen heats first and sends the real load once, when the user is ready (D-097)
    {% elif printer.extruder.temperature < t - 5 %}
      RESPOND MSG="Heating to {t}°C for {m}. Run Load again when the nozzle is hot."
    {% else %}
      {% set f = s.tpu_speed if m == 'TPU' else s.load_speed %}
      {% set fp = s.tpu_speed if m == 'TPU' else s.purge_speed %}
      {% set fr = s.tpu_speed * 5 if m == 'TPU' else s.unload_speed %}
      SAVE_GCODE_STATE NAME=_ss_fil
      M83
      G1 E{s.load_mm} F{f}
      G1 E{s.purge_mm} F{fp}
      G1 E-{s.load_retract_mm} F{fr}
      RESTORE_GCODE_STATE NAME=_ss_fil
      SAVE_VARIABLE VARIABLE=loaded_material VALUE='"{m}"'
      RESPOND MSG="{m} loaded. Purge more if the color isn't clean, then Done."
    {% endif %}
  {% endif %}

[gcode_macro PURGE_MORE]
description: Push out more filament (nozzle must already be hot)
gcode:
  {% set s = printer["gcode_macro _SS"] %}
  {% if printer.print_stats.state == 'printing' %}
    RESPOND TYPE=error MSG="Filament is locked while printing."
  {% elif not printer.extruder.can_extrude %}
    RESPOND TYPE=error MSG="Nozzle is too cold to purge."
  {% else %}
    UPDATE_DELAYED_GCODE ID=_SS_FIL_TIMEOUT DURATION={s.heat_timeout}
    SAVE_GCODE_STATE NAME=_ss_fil
    M83
    G1 E{s.load_retract_mm} F{s.purge_speed}
    G1 E{s.purge_mm} F{s.purge_speed}
    G1 E-{s.load_retract_mm} F{s.unload_speed}
    RESTORE_GCODE_STATE NAME=_ss_fil
  {% endif %}

[gcode_macro UNLOAD_FILAMENT]
description: Unload the loaded filament (or MATERIAL=...). Heats first if cold: run again when hot. HEAT=1: only heat.
gcode:
  {% set s = printer["gcode_macro _SS"] %}
  {% set saved = printer.save_variables.variables.loaded_material|default('NONE') %}
  {% set m = params.MATERIAL|default(saved)|upper %}
  {% if printer.print_stats.state == 'printing' %}
    RESPOND TYPE=error MSG="Filament is locked while printing. Pause first."
  {% elif m not in s.materials %}
    RESPOND TYPE=error MSG="No filament recorded as loaded. Use UNLOAD_FILAMENT MATERIAL=PLA|PETG|TPU"
  {% else %}
    {% set t = s.materials[m][0] %}
    M104 S{t}
    UPDATE_DELAYED_GCODE ID=_SS_FIL_TIMEOUT DURATION={s.heat_timeout}
    {% if params.HEAT|default(0)|int %}
      # the touchscreen heats first and sends the real unload once, when the nozzle is hot (D-097)
    {% elif printer.extruder.temperature < t - 5 %}
      RESPOND MSG="Heating to {t}°C to unload {m}. Run Unload again when the nozzle is hot."
    {% else %}
      {% set f = s.tpu_speed * 5 if m == 'TPU' else s.unload_speed %}
      {% set ft = s.tpu_speed if m == 'TPU' else s.unload_tip_speed %}
      SAVE_GCODE_STATE NAME=_ss_fil
      M83
      G1 E{s.unload_tip_mm} F{ft}
      G1 E-{s.unload_mm} F{f}
      RESTORE_GCODE_STATE NAME=_ss_fil
      SAVE_VARIABLE VARIABLE=loaded_material VALUE='"NONE"'
      RESPOND MSG="{m} unloaded. Pull the filament out gently, then Done."
    {% endif %}
  {% endif %}

[gcode_macro FILAMENT_DONE]
description: Finish a filament change: heater off (kept on if a print is paused)
gcode:
  UPDATE_DELAYED_GCODE ID=_SS_FIL_TIMEOUT DURATION=0
  {% if printer.print_stats.state in ['printing', 'paused'] %}
    RESPOND MSG="Filament change done. Heater kept on for the paused print."
  {% else %}
    M104 S0
    RESPOND MSG="Filament change done. Nozzle heater off."
  {% endif %}

[delayed_gcode _SS_FIL_TIMEOUT]
gcode:
  {% if printer.print_stats.state not in ['printing', 'paused'] %}
    M104 S0
    RESPOND TYPE=error MSG="Nozzle heater turned off: the filament change was left unfinished."
  {% endif %}

# ---------------------------------------------------------------------
# Filament runout (called by [filament_switch_sensor] runout_gcode,
# after pause_on_runout has already paused the print)
# ---------------------------------------------------------------------
[gcode_macro _SS_RUNOUT]
description: Runout handler (not a button)
gcode:
  SAVE_VARIABLE VARIABLE=loaded_material VALUE='"NONE"'
  RESPOND TYPE=error MSG="Filament ran out. Print paused: load new filament, then Resume."

# ---------------------------------------------------------------------
# Color change (OrcaSlicer: Printer settings > Machine G-code >
# "Change filament G-code" = M600). Pauses the print; the touchscreen
# shows "Color change" and a guided Change filament flow.
# ---------------------------------------------------------------------
[gcode_macro M600]
description: Color change: pause so the next color can be loaded
gcode:
  {% if printer.pause_resume.is_paused %}
    RESPOND MSG="Color change requested, but the print is already paused."
  {% else %}
    PAUSE
    RESPOND TYPE=error MSG="Color change: change filament, then Resume."
  {% endif %}

# ---------------------------------------------------------------------
# Start of print (D-089). The slicer's start G-code calls:
#   PRINT_START BED=[bed_temperature_initial_layer_single] EXTRUDER=[nozzle_temperature_initial_layer]
# While M190/M109 wait for a heater Klipper does nothing else, not even
# cancel. So PRINT_START pauses the file in the background (PAUSE_BASE:
# no park, no fan change) and a 1 s timer runs the steps: heat bed →
# heat nozzle (soften) → home → clean → cool to probe temperature →
# bed mesh → park → heat nozzle → resume the file. Cancel works at any
# time. Each heating step has start_heat_timeout seconds, or the print
# is canceled. Uses the printer's NOZZLE_CLEAN (WAIT=0) and [bed_mesh]
# when it has them, and Mainsail's PAUSE_BASE / RESUME_BASE / CANCEL_PRINT.
# Filament check first (D-090): nothing recorded as loaded → it asks on
# the screen and in Mainsail (which one is in / load now / cancel) and
# carries on as soon as a filament is recorded.
# ---------------------------------------------------------------------
[gcode_macro PRINT_START]
description: Start of print (slicer): PRINT_START BED=60 EXTRUDER=210 [MATERIAL= NOZZLE= PRINTER=]. Heats without blocking cancel.
variable_stage: ''      # '' (not starting) | filament | bed | nozzle | home | clean | cool | soak | mesh | final
variable_running: ''    # risky step in progress (home_xy | home_z | clean | mesh); still set on the next
                        # tick = it failed, because a failed command aborts the tick (D-105)
variable_tries: 0       # retries used for this print's start
variable_redo: ''       # after re-homing for a retry, go straight back to this step ('mesh')
variable_want: ''       # material the file was sliced for (PRINT_START MATERIAL=, D-106)
variable_accept_material: ''  # "Print anyway" for this material, given before the print started
variable_bed: 0.0
variable_extruder: 0.0
variable_target: 0.0    # °C the current step waits for
variable_since: 0.0     # when the current step began (toolhead clock, s)
variable_warm: False    # bed already near its target when PRINT_START began: no heat soak
variable_soak: 0.0      # s of heat soak for this print (0 = none); the touchscreen shows it
variable_soak_until: 0.0  # toolhead clock when the soak ends; 0 = skipped / done
variable_asked: False   # filament question shown (from the timer: the touchscreen resets its pages
                        # when the print turns "paused", which would close a question sent earlier)
gcode:
  {% set bed = params.BED|default(0)|float %}
  {% set ext = params.EXTRUDER|default(0)|float %}
  {% if printer.print_stats.state != 'printing' %}
    RESPOND TYPE=error MSG="PRINT_START runs at the start of a print file. It isn't a button."
  {% elif bed <= 0 or ext <= 0 %}
    {action_raise_error("PRINT_START needs BED= and EXTRUDER= temperatures: check the slicer's start G-code.")}
  {% else %}
    _SS_ERROR_CLEAR
    SET_GCODE_VARIABLE MACRO=PRINT_START VARIABLE=running VALUE='""'
    SET_GCODE_VARIABLE MACRO=PRINT_START VARIABLE=tries VALUE=0
    SET_GCODE_VARIABLE MACRO=PRINT_START VARIABLE=redo VALUE='""'
    CLEAR_PAUSE
    {% if 'bed_mesh' in printer %}
      BED_MESH_CLEAR
    {% endif %}
    G90
    M83
    G92 E0
    SET_GCODE_VARIABLE MACRO=PRINT_START VARIABLE=bed VALUE={bed}
    SET_GCODE_VARIABLE MACRO=PRINT_START VARIABLE=extruder VALUE={ext}
    SET_GCODE_VARIABLE MACRO=PRINT_START VARIABLE=warm VALUE={printer.heater_bed.temperature >= bed - printer["gcode_macro _SS"].start_soak_warm}
    SET_GCODE_VARIABLE MACRO=PRINT_START VARIABLE=soak VALUE=0
    SET_GCODE_VARIABLE MACRO=PRINT_START VARIABLE=soak_until VALUE=0
    {% set kind = (params.MATERIAL|default('')).split(';')[0]|trim|upper %}
    {% set want = (printer["gcode_macro _SS"].materials.keys()|select('in', [kind[:3], kind[:4]])|list + [''])[0] %}
    SET_GCODE_VARIABLE MACRO=PRINT_START VARIABLE=want VALUE='"{want}"'
    SET_GCODE_VARIABLE MACRO=PRINT_START VARIABLE=asked VALUE=False
    PAUSE_BASE
    {% if printer.save_variables.variables.loaded_material|default('NONE') == 'NONE' %}
      _SS_START_STEP STAGE=filament
      M117 No filament loaded
    {% else %}
      _SS_START_MATERIAL
    {% endif %}
    UPDATE_DELAYED_GCODE ID=_SS_START_TICK DURATION=1
    # right away, before anything has time to heat: parts outside the printer's reach, a file for
    # another nozzle size or another printer cancel the print (D-105, D-106)
    _SS_START_CHECK_FILE NOZZLE={params.NOZZLE|default(0)|float} PRINTER="{params.PRINTER|default('')|replace('"', '')}"
  {% endif %}

[gcode_macro _SS_START_HEAT]
description: PRINT_START: start heating the bed (not a button)
gcode:
  {% set m = printer["gcode_macro PRINT_START"] %}
  M140 S{m.bed}
  _SS_START_STEP STAGE=bed TARGET={m.bed}
  M117 Heating bed

[gcode_macro _SS_START_ASK]
description: PRINT_START: ask about the missing filament (screen + Mainsail prompt, not a button)
gcode:
  RESPOND TYPE=command MSG="action:prompt_begin No filament loaded"
  RESPOND TYPE=command MSG="action:prompt_text Which filament is in? The print waits and starts by itself once one is picked or loaded."
  RESPOND TYPE=command MSG="action:prompt_button_group_start"
  {% for mat in printer["gcode_macro _SS"].materials %}
    RESPOND TYPE=command MSG="action:prompt_button {mat}|_SS_START_FILAMENT MATERIAL={mat}|primary"
  {% endfor %}
  RESPOND TYPE=command MSG="action:prompt_button_group_end"
  RESPOND TYPE=command MSG="action:prompt_footer_button Load filament|RESPOND TYPE=command MSG=action:prompt_end|info"
  RESPOND TYPE=command MSG="action:prompt_footer_button Cancel print|CANCEL_PRINT|error"
  RESPOND TYPE=command MSG="action:prompt_show"

[gcode_macro _SS_START_FILAMENT]
description: PRINT_START: record which filament is loaded (prompt button, not a button)
gcode:
  {% set m = params.MATERIAL|default('')|upper %}
  {% if m in printer["gcode_macro _SS"].materials %}
    SAVE_VARIABLE VARIABLE=loaded_material VALUE='"{m}"'
    RESPOND TYPE=command MSG=action:prompt_end
    RESPOND MSG="{m} recorded as loaded."
  {% else %}
    RESPOND TYPE=error MSG="Unknown material '{m}'. Use PLA, PETG or TPU."
  {% endif %}

[gcode_macro _SS_START_STEP]
description: PRINT_START: set the current step (not a button)
gcode:
  SET_GCODE_VARIABLE MACRO=PRINT_START VARIABLE=stage VALUE='"{params.STAGE|default('')}"'
  SET_GCODE_VARIABLE MACRO=PRINT_START VARIABLE=target VALUE={params.TARGET|default(0)|float}
  SET_GCODE_VARIABLE MACRO=PRINT_START VARIABLE=since VALUE={printer.toolhead.estimated_print_time}

[gcode_macro _SS_START_MESH]
description: PRINT_START: bed mesh, then park and heat to print temperature (not a button)
gcode:
  _SS_START_STEP STAGE=mesh
  {% if 'bed_mesh' in printer %}
    _SS_START_RUN STEP=mesh
  {% else %}
    _SS_START_MESH_DONE
  {% endif %}

[gcode_macro _SS_START_CHECK_FILE]
description: PRINT_START: refuse a file whose labeled parts lie outside this printer's reach (not a button, D-105)
gcode:
  {% set lo = printer.toolhead.axis_minimum %}
  {% set hi = printer.toolhead.axis_maximum %}
  {% set out = [] %}
  {% for obj in printer.exclude_object.objects|default([]) %}
    {% for pt in obj.polygon|default([]) %}
      {% if (pt[0] < lo.x or pt[0] > hi.x or pt[1] < lo.y or pt[1] > hi.y) and obj.name not in out %}
        {% set _ = out.append(obj.name) %}
      {% endif %}
    {% endfor %}
  {% endfor %}
  {% set nozzle = params.NOZZLE|default(0)|float %}
  {% set fitted = printer.save_variables.variables.nozzle_size|default(0.4)|float %}
  {% set name = params.PRINTER|default('') %}
  {% set names = printer["gcode_macro _SS"].printer_names %}
  {% if out %}
    _SS_START_FAIL CODE=file_bounds DETAIL="{out|join(', ')|replace('"', '')}"
  {% elif nozzle > 0 and (nozzle - fitted)|abs > 0.01 %}
    _SS_START_FAIL CODE=nozzle DETAIL="file {nozzle} mm, installed {fitted} mm"
  {% elif name and not (names|select('in', name|lower)|list) %}
    _SS_START_FAIL CODE=printer DETAIL="{name}"
  {% endif %}

[gcode_macro _SS_START_MARK]
description: PRINT_START: mark the risky step in progress (not a button)
gcode:
  {% set run = params.RUN|default('') %}
  SET_GCODE_VARIABLE MACRO=PRINT_START VARIABLE=running VALUE='"{run}"'
  {% if run and printer["gcode_macro _SS"].start_fail_test %}
    _SS_START_TEST_FAIL RUN={run}
  {% endif %}

[gcode_macro _SS_START_TEST_FAIL]
description: TESTS ONLY: fail the marked step when start_fail_test asks for it (not a button, D-105)
gcode:
  # a separate macro, so the running mark above is already saved when this fails
  {% set run = params.RUN %}
  {% set test = printer["gcode_macro _SS"].start_fail_test %}
  {% if test == run or (test == run ~ '_once' and printer["gcode_macro PRINT_START"].tries == 0) %}
    {action_raise_error("Test failure of " ~ run ~ " (start_fail_test)")}
  {% endif %}

[gcode_macro _SS_START_RUN]
description: PRINT_START: run a step that can fail (homing, nozzle clean, bed mesh) (not a button, D-105)
gcode:
  {% set step = params.STEP|default('') %}
  {% set m = printer["gcode_macro PRINT_START"] %}
  # A failed command aborts the rest of this tick, so the next tick is booked first; it finds the
  # step still marked as running and retries or cancels.
  UPDATE_DELAYED_GCODE ID=_SS_START_TICK DURATION=2
  {% if step == 'home' %}
    _SS_START_MARK RUN=home_xy
    M117 Homing X and Y
    G28 X Y
    _SS_START_MARK RUN=home_z
    M117 Homing Z
    G28 Z
    _SS_START_MARK RUN=
    {% if m.redo == 'mesh' %}
      SET_GCODE_VARIABLE MACRO=PRINT_START VARIABLE=redo VALUE='""'
      _SS_START_MESH
    {% elif 'gcode_macro NOZZLE_CLEAN' in printer %}
      _SS_START_STEP STAGE=clean
      _SS_START_RUN STEP=clean
    {% else %}
      _SS_START_SOAK
    {% endif %}
  {% elif step == 'clean' %}
    {% set clean = printer["gcode_macro NOZZLE_CLEAN"].clean_temp|float %}
    _SS_START_MARK RUN=clean
    M117 Cleaning nozzle
    NOZZLE_CLEAN WAIT=0
    _SS_START_MARK RUN=
    _SS_START_STEP STAGE=cool TARGET={clean}
    M117 Cooling nozzle to {clean|round|int}°C for the bed mesh
  {% elif step == 'mesh' %}
    _SS_START_MARK RUN=mesh
    M117 Measuring the bed
    BED_MESH_CALIBRATE
    _SS_START_MARK RUN=
    _SS_START_MESH_DONE
  {% endif %}

[gcode_macro _SS_START_MESH_DONE]
description: PRINT_START: check the new bed mesh, park, heat to print temperature (not a button, D-105)
gcode:
  {% set m = printer["gcode_macro PRINT_START"] %}
  {% set s = printer["gcode_macro _SS"] %}
  {% set park = s.start_park %}
  {% set vals = [] %}
  {% for row in printer.bed_mesh.probed_matrix|default([]) %}
    {% for z in row %}
      {% set _ = vals.append(z) %}
    {% endfor %}
  {% endfor %}
  {% set span = (vals|max - vals|min) if vals else 0 %}
  {% if span > s.mesh_stop %}
    _SS_START_FAIL CODE=mesh_uneven DETAIL="{'%.2f' % span} mm"
  {% else %}
    {% if span > s.mesh_warn %}
      _SS_ERROR_SET CODE=mesh_warn LEVEL=warn DETAIL="{'%.2f' % span} mm"
      RESPOND TYPE=error MSG="Bed is uneven ({'%.2f' % span} mm across the mesh). The print goes on; level (tram) the bed soon."
    {% endif %}
    G90
    G0 X{park[0]} Y{park[1]} Z{park[2]} F4800
    M104 S{m.extruder}
    _SS_START_STEP STAGE=final TARGET={m.extruder}
    M117 Heating nozzle
  {% endif %}

[gcode_macro _SS_START_FAIL]
description: PRINT_START: cancel the print with a clear reason (not a button, D-105)
gcode:
  {% set code = params.CODE|default('unknown') %}
  {% set t = printer["gcode_macro _SS_ERROR"].texts %}
  {% set e = t[code] if code in t else t['unknown'] %}
  {% set detail = params.DETAIL|default('') %}
  _SS_START_STEP STAGE=
  _SS_START_MARK RUN=
  M117
  _SS_ERROR_SET CODE={code} LEVEL=error DETAIL="{detail}"
  RESPOND TYPE=error MSG="Print canceled: {e[0]}{(' (' ~ detail ~ ')') if detail else ''}. {e[1]}"
  CANCEL_PRINT

[gcode_macro _SS_START_MATERIAL]
description: PRINT_START: the loaded filament against the file's material, then heat (not a button, D-106)
gcode:
  {% set m = printer["gcode_macro PRINT_START"] %}
  {% set loaded = printer.save_variables.variables.loaded_material|default('NONE') %}
  {% if m.want and loaded != m.want and m.accept_material != m.want %}
    _SS_START_STEP STAGE=material
    M117 File is for {m.want}, {loaded} is loaded
  {% else %}
    SET_GCODE_VARIABLE MACRO=PRINT_START VARIABLE=accept_material VALUE='""'
    _SS_START_HEAT
  {% endif %}

[gcode_macro _SS_START_ASK_MATERIAL]
description: PRINT_START: ask about a different filament (screen + Mainsail prompt, not a button, D-106)
gcode:
  {% set m = printer["gcode_macro PRINT_START"] %}
  {% set loaded = printer.save_variables.variables.loaded_material|default('NONE') %}
  RESPOND TYPE=command MSG="action:prompt_begin Different filament loaded"
  RESPOND TYPE=command MSG="action:prompt_text This file is for {m.want}, but {loaded} is loaded. Change the filament (touchscreen: Change filament) and the print starts by itself, or print anyway."
  RESPOND TYPE=command MSG="action:prompt_footer_button Print anyway|ACCEPT_MATERIAL|warning"
  RESPOND TYPE=command MSG="action:prompt_footer_button Cancel print|CANCEL_PRINT|error"
  RESPOND TYPE=command MSG="action:prompt_show"

[gcode_macro ACCEPT_MATERIAL]
description: Print anyway with the filament that is loaded (the file is for another material)
gcode:
  {% set want = params.MATERIAL|default(printer["gcode_macro PRINT_START"].want)|upper %}
  SET_GCODE_VARIABLE MACRO=PRINT_START VARIABLE=accept_material VALUE='"{want}"'
  RESPOND TYPE=command MSG=action:prompt_end

[gcode_macro SET_NOZZLE]
description: The nozzle size that is installed, checked against every file: SET_NOZZLE SIZE=0.4
gcode:
  {% set size = params.SIZE|default(0)|float %}
  {% if size not in printer["gcode_macro _SS"].nozzles %}
    RESPOND TYPE=error MSG="Use SET_NOZZLE SIZE= one of {printer['gcode_macro _SS'].nozzles|join(', ')}"
  {% else %}
    SAVE_VARIABLE VARIABLE=nozzle_size VALUE={size}
    RESPOND MSG="Installed nozzle: {size} mm. Files sliced for another size are refused."
  {% endif %}

[gcode_macro _SS_START_SOAK]
description: PRINT_START: wait out the bed heat soak, then the bed mesh (not a button)
gcode:
  {% set m = printer["gcode_macro PRINT_START"] %}
  {% set left = m.soak_until - printer.toolhead.estimated_print_time %}
  {% if m.soak_until > 0 and left > 0 %}
    {% if m.stage != 'soak' %}
      _SS_START_STEP STAGE=soak TARGET={left|round(0, 'ceil')}
    {% else %}
      SET_GCODE_VARIABLE MACRO=PRINT_START VARIABLE=target VALUE={left|round(0, 'ceil')}
    {% endif %}
    M117 Heat soaking bed {(left // 60)|int}:{'%02d' % (left % 60)|int}
  {% else %}
    SET_GCODE_VARIABLE MACRO=PRINT_START VARIABLE=soak_until VALUE=0
    _SS_START_MESH
  {% endif %}

[gcode_macro SKIP_SOAK]
description: Skip the bed heat soak of the print that is starting
gcode:
  {% set m = printer["gcode_macro PRINT_START"] %}
  {% if m.soak_until > 0 %}
    SET_GCODE_VARIABLE MACRO=PRINT_START VARIABLE=soak_until VALUE=0
    RESPOND MSG="Heat soak skipped."
  {% else %}
    RESPOND MSG="No heat soak is running."
  {% endif %}

[delayed_gcode _SS_START_TICK]
gcode:
  {% set m = printer["gcode_macro PRINT_START"] %}
  {% set s = printer["gcode_macro _SS"] %}
  {% set state = printer.print_stats.state %}
  {% set bed_t = printer.heater_bed.temperature %}
  {% set ext_t = printer.extruder.temperature %}
  {% if m.stage != '' %}
    {% if state != 'paused' %}
      # canceled (or resumed by hand): stop here
      {% if m.stage in ['filament', 'material'] %}
        RESPOND TYPE=command MSG=action:prompt_end
      {% endif %}
      _SS_START_STEP STAGE=
      M117
      {% if state == 'printing' %}
        RESPOND TYPE=error MSG="The print was resumed before it finished getting ready."
      {% endif %}
    {% elif m.stage != 'soak' and printer.toolhead.estimated_print_time - m.since > s.start_heat_timeout %}
      {% set mins = (s.start_heat_timeout / 60)|round|int %}
      {% set what = "bed didn't reach" if m.stage == 'bed'
               else "nozzle didn't cool to" if m.stage == 'cool' else "nozzle didn't reach" %}
      _SS_START_STEP STAGE=
      M117
      {% if m.stage in ['filament', 'material'] %}
        RESPOND TYPE=command MSG=action:prompt_end
        RESPOND TYPE=error MSG="Print canceled: no filament was loaded or picked within {mins} minutes."
      {% else %}
        RESPOND TYPE=error MSG="Print canceled: the {what} {m.target|round|int}°C in {mins} minutes. Check the heater and its cable."
      {% endif %}
      CANCEL_PRINT
    {% elif m.running %}
      # the step marked as running failed (Klipper's own error is in the console)
      {% set t = printer["gcode_macro _SS_ERROR"].texts %}
      {% set e = t[m.running] if m.running in t else t['unknown'] %}
      {% if m.tries < s.start_retries %}
        RESPOND TYPE=error MSG="{e[0]}: trying again ({m.tries + 1}/{s.start_retries})."
        SET_GCODE_VARIABLE MACRO=PRINT_START VARIABLE=tries VALUE={m.tries + 1}
        SET_GCODE_VARIABLE MACRO=PRINT_START VARIABLE=redo VALUE='"{'mesh' if m.running == 'mesh' else ''}"'
        _SS_START_MARK RUN=
        # a failed homing or probe turns the motors off: start again from homing
        _SS_START_STEP STAGE=home
        M117 Trying again: homing
        UPDATE_DELAYED_GCODE ID=_SS_START_TICK DURATION=2
      {% else %}
        _SS_START_FAIL CODE={m.running}
      {% endif %}
    {% else %}
      {% if m.stage == 'filament' %}
        {% if printer.save_variables.variables.loaded_material|default('NONE') != 'NONE' %}
          RESPOND TYPE=command MSG=action:prompt_end
          SET_GCODE_VARIABLE MACRO=PRINT_START VARIABLE=asked VALUE=False
          _SS_START_MATERIAL
        {% elif not m.asked %}
          SET_GCODE_VARIABLE MACRO=PRINT_START VARIABLE=asked VALUE=True
          _SS_START_ASK
        {% endif %}
      {% elif m.stage == 'material' %}
        {% set loaded = printer.save_variables.variables.loaded_material|default('NONE') %}
        {% if loaded == m.want or m.accept_material == m.want %}
          RESPOND TYPE=command MSG=action:prompt_end
          _SS_START_MATERIAL
        {% elif loaded == 'NONE' %}
          # unloaded during a filament change: keep waiting for the new one
        {% elif not m.asked %}
          SET_GCODE_VARIABLE MACRO=PRINT_START VARIABLE=asked VALUE=True
          _SS_START_ASK_MATERIAL
        {% endif %}
      {% elif m.stage == 'bed' %}
        {% if bed_t >= m.target - 1 %}
          {% set mat = printer.save_variables.variables.loaded_material|default('NONE') %}
          {% set soak = s.start_soak.get(mat, 0) %}
          {% if soak > 0 and m.warm %}
            RESPOND MSG="Bed was already warm: no heat soak."
          {% elif soak > 0 %}
            SET_GCODE_VARIABLE MACRO=PRINT_START VARIABLE=soak VALUE={soak}
            SET_GCODE_VARIABLE MACRO=PRINT_START VARIABLE=soak_until VALUE={printer.toolhead.estimated_print_time + soak}
            RESPOND MSG="Heat soaking the bed for {(soak / 60)|round(1)} min (nozzle heats and cleans meanwhile)."
          {% endif %}
          {% set soft = m.extruder - s.start_soften_drop %}
          M104 S{soft}
          _SS_START_STEP STAGE=nozzle TARGET={soft}
          M117 Heating nozzle
        {% else %}
          M117 Heating bed {bed_t|round|int}/{m.target|round|int}°C
        {% endif %}
      {% elif m.stage == 'nozzle' %}
        {% if ext_t >= m.target - 2 %}
          _SS_START_STEP STAGE=home
          _SS_START_RUN STEP=home
        {% else %}
          M117 Heating nozzle {ext_t|round|int}/{m.target|round|int}°C
        {% endif %}
      {% elif m.stage == 'cool' %}
        {% if (ext_t - m.target)|abs <= 2 %}
          _SS_START_SOAK
        {% endif %}
      {% elif m.stage == 'home' %}
        _SS_START_RUN STEP=home
      {% elif m.stage == 'clean' %}
        _SS_START_RUN STEP=clean
      {% elif m.stage == 'mesh' %}
        _SS_START_RUN STEP=mesh
      {% elif m.stage == 'soak' %}
        _SS_START_SOAK
      {% elif m.stage == 'final' %}
        {% if ext_t >= m.target - 2 %}
          _SS_START_STEP STAGE=
          M117 Printing
          # resume right here (PAUSE_STATE was saved before homing: don't move back to it)
          SAVE_GCODE_STATE NAME=PAUSE_STATE
          RESUME_BASE
        {% else %}
          M117 Heating nozzle {ext_t|round|int}/{m.target|round|int}°C
        {% endif %}
      {% endif %}
      UPDATE_DELAYED_GCODE ID=_SS_START_TICK DURATION=1
    {% endif %}
  {% endif %}

# ---------------------------------------------------------------------
# Errors (D-105): the last one is shown on the touchscreen Home as a card
# until dismissed; a short history is kept in save_variables (error_log).
# Texts: [what failed, what to check]. No apostrophes (shell-style quoting).
# ---------------------------------------------------------------------
[gcode_macro _SS_ERROR]
description: Last StarStack error for the touchscreen (not a button)
variable_current: {}
variable_texts: {
    'home_xy': ['X or Y did not find its end (homing)', 'Check nothing blocks the print head or the bed, and that the belts are tight.'],
    'home_z': ['The nozzle probe did not trigger while homing Z', 'Check the nozzle is clean and the back right of the bed is clear.'],
    'clean': ['Cleaning the nozzle or re-homing Z on the probe failed', 'Check the brush and that the nozzle is clean.'],
    'mesh': ['Measuring the bed failed', 'The probe did not trigger or its readings disagreed. Check the nozzle is clean and the bed surface is clear.'],
    'mesh_uneven': ['The bed is far too uneven', 'Something is badly off: check the bed is fixed down and nothing is under it, then level (tram) it.'],
    'mesh_warn': ['The bed is uneven', 'The print went on. Level (tram) the bed soon for better first layers.'],
    'file_bounds': ['Parts are outside what this printer can reach', 'Slice the file for this printer: the parts must fit on the bed.'],
    'nozzle': ['The file is for another nozzle size', 'Slice it again for the installed nozzle, or swap the nozzle and set it in Settings, Installed nozzle.'],
    'printer': ['The file was sliced for another printer', 'Slice it again with the StarStack S1 printer profile in OrcaSlicer.'],
    'unknown': ['Something failed while getting ready', 'See the console in Mainsail for details.']}
gcode:
  RESPOND MSG="Last error: {printer['gcode_macro _SS_ERROR'].current}"

[gcode_macro _SS_ERROR_SET]
description: Record an error or warning for the touchscreen (not a button, D-105)
gcode:
  {% set code = params.CODE|default('unknown') %}
  {% set t = printer["gcode_macro _SS_ERROR"].texts %}
  {% set e = t[code] if code in t else t['unknown'] %}
  {% set rec = {'code': code, 'level': params.LEVEL|default('error'), 'title': e[0], 'check': e[1],
                'detail': params.DETAIL|default('')|replace("'", ''), 'file': printer.print_stats.filename} %}
  SET_GCODE_VARIABLE MACRO=_SS_ERROR VARIABLE=current VALUE='{rec|tojson}'
  {% set log = (printer.save_variables.variables.error_log|default([]))[-9:] + [[code, rec.file]] %}
  SAVE_VARIABLE VARIABLE=error_log VALUE='{log|tojson}'

[gcode_macro _SS_ERROR_CLEAR]
description: Dismiss the error card (not a button, D-105)
gcode:
  SET_GCODE_VARIABLE MACRO=_SS_ERROR VARIABLE=current VALUE='{ {} }'

[gcode_macro _SS_RESUME_GUARD]
description: Stops RESUME while PRINT_START is still getting ready (not a button)
gcode:
  {% if printer["gcode_macro PRINT_START"].stage %}
    {action_raise_error("Still getting ready (heating, homing, bed mesh): the print starts by itself.")}
  {% endif %}
