# STARSTACK: tested versions (klipper-ui D-087). Linked into the printer's config folder as
# starstack-updates.conf and included at the end of moonraker.conf by install.sh.
#
# "Update everything" (touchscreen or Mainsail) never goes past these commits. To move to a newer
# Klipper or Moonraker: test it on the S1, then run scripts/pin-versions.sh and release klipper-ui.
# On each printer the update helper (update/starstack-update.py) applies the new pins right after
# klipper-ui updates, then brings the board firmware to the same Klipper version.
#
# Only Klipper and Moonraker are pinned: they are built into Moonraker's updater, so these sections
# are safe on any printer. Mainsail is a web download (official releases only, no pin possible).

[update_manager]
refresh_interval: 24

[update_manager klipper]
